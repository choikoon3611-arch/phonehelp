<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>투게더 결합 신청서</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden;}
.toolbar{background:#1a0a2e;color:#fff;height:42px;padding:0 14px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:500;}
.toolbar a{color:#c4b5fd;font-size:13px;text-decoration:none;}
.toolbar .title{flex:1;font-size:14px;font-weight:700;}
.toolbar button{padding:5px 13px;border:none;border-radius:6px;background:#7c3aed;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.app{display:flex;height:calc(100vh - 42px);margin-top:42px;}
.sidebar{width:270px;flex-shrink:0;background:#f8fafc;border-right:2px solid #e2e8f0;overflow-y:auto;}
.sb-sec{padding:8px 10px;border-bottom:1px solid #e2e8f0;}
.sb-ttl{font-size:10px;font-weight:800;color:#7c3aed;letter-spacing:.5px;margin-bottom:6px;}
.sb-field{margin-bottom:5px;}
.sb-field label{font-size:10px;font-weight:700;color:#94a3b8;display:block;margin-bottom:2px;}
.sb-field input{width:100%;height:26px;padding:0 7px;border:1.5px solid #e2e8f0;border-radius:5px;font-size:12px;font-family:'Malgun Gothic',sans-serif;color:#1e293b;background:#fff;}
.sb-field input:focus{border-color:#7c3aed;outline:none;}
.cb-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.cb-row button{flex:1;padding:5px;border:1.5px solid #e2e8f0;border-radius:6px;background:#fff;font-size:11px;font-weight:700;color:#475569;cursor:pointer;}
.cb-row button.on{border-color:#dc2626;background:#dc2626;color:#fff;}
.sb-row-hd{font-size:10px;font-weight:800;color:#7c3aed;margin:6px 0 3px;letter-spacing:.3px;}
.sb-row{display:flex;gap:4px;margin-bottom:3px;}
.sb-row input{flex:1;height:24px;padding:0 5px;border:1.5px solid #e2e8f0;border-radius:4px;font-size:11px;font-family:'Malgun Gothic',sans-serif;color:#1e293b;background:#fff;min-width:0;}
.sb-row input:focus{border-color:#7c3aed;outline:none;}
.copy-btn{width:100%;padding:8px;border:2px dashed #7c3aed;border-radius:8px;background:#faf5ff;color:#6d28d9;font-size:12px;font-weight:800;cursor:pointer;font-family:'Malgun Gothic',sans-serif;margin-bottom:4px;}
.reset-btn{width:100%;padding:5px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#94a3b8;font-size:11px;cursor:pointer;font-family:'Malgun Gothic',sans-serif;}
#notice{font-size:11px;font-weight:700;text-align:center;padding:3px;border-radius:4px;opacity:0;transition:opacity .3s;margin-top:3px;color:#16a34a;}
.main{flex:1;overflow-y:auto;background:#e8edf2;padding:10px;}
.form-section{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;}
.form-ttl{background:#ede9fe;padding:8px 16px;font-size:12px;font-weight:800;color:#6d28d9;border-left:5px solid #7c3aed;}
.doc-wrap{position:relative;width:794px;max-width:100%;margin:0 auto;}
.doc-wrap img{display:block;width:100%;height:auto;}
.ft{position:absolute;display:block;transform:translateY(-50%);font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:11.5px;font-weight:700;color:#1a1a8c;white-space:nowrap;line-height:1;cursor:grab;z-index:10;min-width:8px;min-height:12px;}
.ft:active{cursor:grabbing;}
#dinfo{position:fixed;bottom:14px;right:14px;background:rgba(15,23,42,.92);color:#c4b5fd;font-size:13px;font-family:monospace;font-weight:700;padding:8px 16px;border-radius:10px;z-index:999;display:none;}
@media print{
  .toolbar,.sidebar,#dinfo{display:none!important;}
  body,html{overflow:visible;}
  .app{display:block;height:auto;margin:0;}
  .main{overflow:visible;padding:0;background:#fff;}
  .form-section{box-shadow:none;border-radius:0;}
  .form-ttl{display:none;}
  .doc-wrap{width:100%;max-width:none;}
}
</style>
</head>
<body>
<div class="toolbar">
  <a href="../hub.html">← 허브</a>
  <span class="title">투게더 결합 신청서</span>
  <button onclick="window.print()">🖨️ 인쇄</button>
</div>
<div class="app">
<div class="sidebar">
  <div class="sb-sec">
    <div class="sb-ttl">👤 대표자 정보</div>
    <div class="sb-field"><label>가입자명</label><input id="s-c-name" oninput="sync(this,'c-name')" placeholder="홍길동"></div>
    <div class="sb-field"><label>생년월일</label><input id="s-c-birth" oninput="sync(this,'c-birth')" placeholder="YYMMDD"></div>
    <div class="sb-field"><label>휴대폰번호</label><input id="s-c-phone" oninput="sync(this,'c-phone')" placeholder="010-0000-0000"></div>
    <div class="sb-field"><label>설치주소</label><input id="s-c-addr" oninput="sync(this,'c-addr')" placeholder="주소 입력"></div>
  </div>
  <div class="sb-sec">
    <div class="sb-ttl">🔗 결합방식</div>
    <div class="cb-row">
      <button id="cb-normal-btn" onclick="toggleCb('normal')">일반결합</button>
      <button id="cb-bill-btn" onclick="toggleCb('bill')">청구통합</button>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-ttl">📱 휴대폰 회선 (최대 5회선)</div>

      <input id="s-m1-rel" placeholder="관계" oninput="sync(this,'m1-rel')">
    </div>
    <div class="sb-row">
      <input id="s-m1-phone" placeholder="휴대폰번호" oninput="sync(this,'m1-phone')" style="flex:1.5">
      <input id="s-m1-plan" placeholder="요금제" oninput="sync(this,'m1-plan')">
    </div>
    <div class="sb-row-hd">휴대폰 2회선</div>
    <div class="sb-row">
      <input id="s-m2-name" placeholder="고객명" oninput="sync(this,'m2-name')">

      <input id="s-m2-rel" placeholder="관계" oninput="sync(this,'m2-rel')">
    </div>
    <div class="sb-row">
      <input id="s-m2-phone" placeholder="휴대폰번호" oninput="sync(this,'m2-phone')" style="flex:1.5">
      <input id="s-m2-plan" placeholder="요금제" oninput="sync(this,'m2-plan')">
    </div>
    <div class="sb-row-hd">휴대폰 3회선</div>
    <div class="sb-row">
      <input id="s-m3-name" placeholder="고객명" oninput="sync(this,'m3-name')">
      <input id="s-m3-birth" placeholder="생년월일" oninput="sync(this,'m3-birth')">
      <input id="s-m3-rel" placeholder="관계" oninput="sync(this,'m3-rel')">
    </div>
    <div class="sb-row">
      <input id="s-m3-phone" placeholder="휴대폰번호" oninput="sync(this,'m3-phone')" style="flex:1.5">
      <input id="s-m3-plan" placeholder="요금제" oninput="sync(this,'m3-plan')">
    </div>
    <div class="sb-row-hd">휴대폰 4회선</div>
    <div class="sb-row">
      <input id="s-m4-name" placeholder="고객명" oninput="sync(this,'m4-name')">

      <input id="s-m4-rel" placeholder="관계" oninput="sync(this,'m4-rel')">
    </div>
    <div class="sb-row">
      <input id="s-m4-phone" placeholder="휴대폰번호" oninput="sync(this,'m4-phone')" style="flex:1.5">
      <input id="s-m4-plan" placeholder="요금제" oninput="sync(this,'m4-plan')">
    </div>
    <div class="sb-row-hd">휴대폰 5회선</div>
    <div class="sb-row">
      <input id="s-m5-name" placeholder="고객명" oninput="sync(this,'m5-name')">
      <input id="s-m5-birth" placeholder="생년월일" oninput="sync(this,'m5-birth')">
      <input id="s-m5-rel" placeholder="관계" oninput="sync(this,'m5-rel')">
    </div>
    <div class="sb-row">
      <input id="s-m5-phone" placeholder="휴대폰번호" oninput="sync(this,'m5-phone')" style="flex:1.5">
      <input id="s-m5-plan" placeholder="요금제" oninput="sync(this,'m5-plan')">
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-ttl">🌐 인터넷 회선 (최대 5회선)</div>
    
    <div class="sb-row-hd">인터넷 1회선</div>
    <div class="sb-row">
      <input id="s-n1-name" placeholder="고객명" oninput="sync(this,'n1-name')">
      <input id="s-n1-birth" placeholder="생년월일" oninput="sync(this,'n1-birth')">
      <input id="s-n1-rel" placeholder="관계" oninput="sync(this,'n1-rel')">
    </div>
    <div class="sb-row">
      <input id="s-n1-addr" placeholder="주소" oninput="sync(this,'n1-addr')" style="flex:2">
      <input id="s-n1-plan" placeholder="요금제" oninput="sync(this,'n1-plan')">
    </div>
    <div class="sb-row-hd">인터넷 2회선</div>
    <div class="sb-row">
      <input id="s-n2-name" placeholder="고객명" oninput="sync(this,'n2-name')">
      <input id="s-n2-birth" placeholder="생년월일" oninput="sync(this,'n2-birth')">
      <input id="s-n2-rel" placeholder="관계" oninput="sync(this,'n2-rel')">
    </div>
    <div class="sb-row">
      <input id="s-n2-addr" placeholder="주소" oninput="sync(this,'n2-addr')" style="flex:2">
      <input id="s-n2-plan" placeholder="요금제" oninput="sync(this,'n2-plan')">
    </div>
    <div class="sb-row-hd">인터넷 3회선</div>
    <div class="sb-row">
      <input id="s-n3-name" placeholder="고객명" oninput="sync(this,'n3-name')">
      <input id="s-n3-birth" placeholder="생년월일" oninput="sync(this,'n3-birth')">
      <input id="s-n3-rel" placeholder="관계" oninput="sync(this,'n3-rel')">
    </div>
    <div class="sb-row">
      <input id="s-n3-addr" placeholder="주소" oninput="sync(this,'n3-addr')" style="flex:2">
      <input id="s-n3-plan" placeholder="요금제" oninput="sync(this,'n3-plan')">
    </div>
    <div class="sb-row-hd">인터넷 4회선</div>
    <div class="sb-row">
      <input id="s-n4-name" placeholder="고객명" oninput="sync(this,'n4-name')">
      <input id="s-n4-birth" placeholder="생년월일" oninput="sync(this,'n4-birth')">
      <input id="s-n4-rel" placeholder="관계" oninput="sync(this,'n4-rel')">
    </div>
    <div class="sb-row">
      <input id="s-n4-addr" placeholder="주소" oninput="sync(this,'n4-addr')" style="flex:2">
      <input id="s-n4-plan" placeholder="요금제" oninput="sync(this,'n4-plan')">
    </div>
    <div class="sb-row-hd">인터넷 5회선</div>
    <div class="sb-row">
      <input id="s-n5-name" placeholder="고객명" oninput="sync(this,'n5-name')">
      <input id="s-n5-birth" placeholder="생년월일" oninput="sync(this,'n5-birth')">
      <input id="s-n5-rel" placeholder="관계" oninput="sync(this,'n5-rel')">
    </div>
    <div class="sb-row">
      <input id="s-n5-addr" placeholder="주소" oninput="sync(this,'n5-addr')" style="flex:2">
      <input id="s-n5-plan" placeholder="요금제" oninput="sync(this,'n5-plan')">
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-ttl">💰 할인방식</div>
    <div class="cb-row">
      <button id="disc-ind-btn" onclick="toggleDisc('ind')">☐ 개별할인</button>
      <button id="disc-des-btn" onclick="toggleDisc('des')">☐ 1인 지정 할인</button>
    </div>
    <div id="disc-num-wrap" class="sb-field" style="display:none;margin-top:4px;">
      <label>지정번호</label>
      <input id="s-disc-num" placeholder="지정번호 입력" oninput="sync(this,'disc-num')">
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-ttl">📦 패키지</div>
    <div class="cb-row">
      <button id="pkg-all-btn" onclick="togglePkg()">☐ 올인원</button>
    </div>
  </div>
  <div class="sb-sec">
    <button class="copy-btn" onclick="copyCoords()">📋 좌표 복사</button>
    <div id="notice"></div>
    <button class="reset-btn" onclick="resetAll()">↺ 전체 초기화</button>
  </div>
</div>

function toggleCb(key){

    cbState[key]=true;
    btn.classList.add('on');
    if(el) el.textContent='✔';
  }
}

function makeDrag(el){
  el.addEventListener('mousedown',function(e){
    e.preventDefault();e.stopPropagation();
    var wrap=document.getElementById('dw');
    var iL=parseFloat(el.style.left)||0,iT=parseFloat(el.style.top)||0;
    var iX=e.clientX,iY=e.clientY,wW=wrap.offsetWidth,wH=wrap.offsetHeight;
    document.body.style.userSelect='none';
    dinfo.style.display='block';
    function mv(e){
      var dx=(e.clientX-iX)/wW*100,dy=(e.clientY-iY)/wH*100;
      var nx=Math.max(0,Math.min(100,iL+dx)).toFixed(1),ny=Math.max(0,Math.min(100,iT+dy)).toFixed(1);
      el.style.left=nx+'%';el.style.top=ny+'%';
      dinfo.textContent=(el.dataset.fid||el.id)+'  x:'+nx+'%  y:'+ny+'%';
    }
    function up(){document.body.style.userSelect='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
}
document.querySelectorAll('.ft').forEach(makeDrag);

var discState={};
function toggleDisc(key){
  var fid='disc-'+key;
  var btn=document.getElementById(fid+'-btn');
  var el=document.getElementById(fid);
  if(discState[key]){
    discState[key]=false;
    btn.classList.remove('on');
    btn.textContent=(key==='ind'?'☐ 개별할인':'☐ 1인 지정 할인');
    if(el) el.textContent='';
    if(key==='des') document.getElementById('disc-num-wrap').style.display='none';
  }else{
    discState[key]=true;
    btn.classList.add('on');
    btn.textContent=(key==='ind'?'☑ 개별할인':'☑ 1인 지정 할인');
    if(el) el.textContent='✔';
    if(key==='des') document.getElementById('disc-num-wrap').style.display='';
  }
}

var pkgState=false;
function togglePkg(){
  var btn=document.getElementById('pkg-all-btn');
  var el=document.getElementById('pkg-all');
  pkgState=!pkgState;
  btn.classList.toggle('on',pkgState);
  btn.textContent=pkgState?'☑ 올인원':'☐ 올인원';
  if(el) el.textContent=pkgState?'✔':'';
}

function sync(inp,fid){
  var el=document.getElementById(fid);
  if(el) el.textContent=inp.value;
}
function copyCoords(){
  var lines=[];
  document.querySelectorAll('.ft').forEach(function(ft){
    lines.push(ft.dataset.fid+': x:'+parseFloat(ft.style.left).toFixed(1)+'% y:'+parseFloat(ft.style.top).toFixed(1)+'%');
  });
  var txt=lines.join('\n');
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){showN('✅ 복사완료');});
  else prompt('좌표:',txt);
}
function showN(msg){var n=document.getElementById('notice');n.textContent=msg;n.style.opacity='1';setTimeout(function(){n.style.opacity='0';},2500);}
function resetAll(){
  document.querySelectorAll('.sb-field input,.sb-row input').forEach(function(i){i.value='';});
  document.querySelectorAll('.ft').forEach(function(ft){ft.textContent='';});
  cbState={};discState={};pkgState=false;
  document.querySelectorAll('.cb-row button').forEach(function(b){b.classList.remove('on');});
  document.getElementById('disc-ind-btn').textContent='☐ 개별할인';
  document.getElementById('disc-des-btn').textContent='☐ 1인 지정 할인';
  document.getElementById('pkg-all-btn').textContent='☐ 올인원';
  document.getElementById('disc-num-wrap').style.display='none';
  dinfo.style.display='none';
}
</script>
</body>
</html>
