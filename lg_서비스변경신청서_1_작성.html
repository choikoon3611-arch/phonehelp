<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG 서비스 변경 신청서 1/2</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #ececec;
    margin: 0;
    padding: 20px;
  }

  .cust-bar {
    display: none; max-width: 700px; margin: 0 auto 10px;
    background: #dbeafe; border: 1.5px solid #93c5fd; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .cust-bar.show { display: flex; }
  .cust-bar .cb-title { font-weight: 800; color: #1e3a8a; font-size: 13px; flex-shrink:0; }
  .cust-bar .cb-item { display: flex; align-items: center; gap: 5px; color: #1e3a8a; }
  .cust-bar .cb-label { font-weight: 700; white-space: nowrap; }
  .cust-bar .cb-val { font-weight: 400; }
  .cb-copy {
    padding: 2px 7px; font-size: 11px; font-weight: 700; border-radius: 5px;
    border: 1px solid #93c5fd; background: #fff; cursor: pointer; color: #1e3a8a;
  }
  .cb-copy:hover { background: #eff6ff; }

  .toolbar {
    max-width: 700px; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .toolbar a { font-size: 13px; color: #2f6feb; text-decoration: none; }
  .toolbar button {
    padding: 9px 16px; font-size: 13px; font-weight: 700;
    border: none; border-radius: 8px; background: #e6007e; color: #fff; cursor: pointer;
  }

  .doc-wrap {
    position: relative; max-width: 700px; margin: 0 auto;
    background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .doc-wrap img { display: block; width: 100%; height: auto; }

  .overlay-input {
    position: absolute; transform: translate(0, -50%);
    border: none; background: transparent;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: min(2.2vw, 15px); font-weight: 700; color: #1a1a8c;
    padding: 0; outline: none;
    border-bottom: 1px dashed transparent;
  }
  .overlay-input:focus { border-bottom: 1px dashed #e6007e; background: rgba(255,230,245,0.3); }
  .overlay-input::placeholder { color: #bbb; font-size: 0.85em; }

  .overlay-textarea {
    position: absolute;
    border: none; background: transparent;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: min(2.0vw, 14px); font-weight: 700; color: #1a1a8c;
    padding: 4px; outline: none; resize: none; overflow: hidden; line-height: 1.5;
  }
  .overlay-textarea:focus { background: rgba(255,230,245,0.25); }
  .overlay-textarea::placeholder { color: #ccc; font-size: 0.85em; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .cust-bar { display: none !important; }
    .doc-wrap { box-shadow: none; max-width: 100%; }
    .overlay-input { color: #000;   font-size: 11pt;
      font-weight: 700;
    }
    .overlay-textarea { color: #000; }
  }
</style>
</head>
<body>

<div class="cust-bar" id="cust-bar">
  <span class="cb-title">📋 고객 정보</span>
</div>

<div class="toolbar">
  <a href="hub.html">← 허브로 돌아가기</a>
  <label class="hdr-btn" style="cursor:pointer;display:inline-flex;align-items:center;" title="새 서류 이미지로 교체">🔄 이미지 교체<input type="file" accept="image/*" style="display:none;" onchange="replaceFormImage(this)"></label> <button class="hdr-btn" id="img-reset-btn" onclick="resetFormImage()" style="display:none;" title="원본 이미지로 복원">↺ 복원</button> <button id="print-btn">🖨 인쇄하기</button>
</div>

<div class="doc-wrap" id="doc-wrap">
  <img src="lg_서비스변경신청서_p1.jpg" alt="LG 서비스 변경 신청서 1/2" id="doc-img">

  <!-- 가입자 정보 -->
  <input class="overlay-input" id="f-name"  placeholder="가입자명"   style="left:7%;  top:11.2%; width:24%;">
  <input class="overlay-input" id="f-birth" placeholder="생년월일"   style="left:35%; top:11.2%; width:24%;">
  <input class="overlay-input" id="f-phone" placeholder="휴대폰번호" style="left:66%; top:11.2%; width:30%;">

  <!-- 요금제 -->
  <input class="overlay-input" id="f-plan"    placeholder="요금제명" style="left:22%; top:25.8%; width:48%;">
  <input class="overlay-input" id="f-monthly" placeholder="금액"     style="left:77%; top:25.8%; width:13%;">

  <!-- 변경할 기타 서비스 정보 -->
  <textarea class="overlay-textarea" id="f-note"
    placeholder="카드번호, 결제금액, 자동이체 여부 등"
    style="left:16%; top:59%; width:82%; height:27%;"></textarea>
</div>

<script>
const _issuanceId = new URLSearchParams(window.location.search).get('id');

if (_issuanceId) {
  try {
    const _lst = JSON.parse(localStorage.getItem('card_issuance_list') || '[]');
    const _c = _lst.find(e => e.id === _issuanceId);
    if (_c) {
      const n = document.getElementById('f-name');
      const p = document.getElementById('f-phone');
      const b = document.getElementById('f-birth');
      if (n && _c.고객명)   n.value = _c.고객명;
      if (p && _c.전화번호) p.value = _c.전화번호;
      if (b && _c.주민번호) b.value = _c.주민번호;

      const note = document.getElementById('f-note');
      if (note) {
        const line1 = [], line2 = [];
        if (_c.카드번호) line1.push('카드번호: ' + _c.카드번호);
        if (_c.유효기간) line1.push('유효기간: ' + _c.유효기간);
        if (_c.결제금액) line2.push('결제금액: ' + _c.결제금액 + '원');
        if (_c.개월수)   line2.push(_c.개월수);
        if (_c.자동이체) line2.push(_c.자동이체);
        const lines = [line1.join(' / '), line2.join(' / ')].filter(l => l);
        if (lines.length) note.value = lines.join('\n');
      }

      const bar = document.getElementById('cust-bar');
      if (bar) {
        const items = [
          { label:'고객명',   val: _c.고객명 },
          { label:'전화번호', val: _c.전화번호 },
          { label:'주민번호', val: _c.주민번호 },
          { label:'카드번호', val: _c.카드번호 },
          { label:'유효기간', val: _c.유효기간 },
          { label:'결제금액', val: _c.결제금액 ? _c.결제금액 + '원' : '' },
          { label:'개월수',   val: _c.개월수 },
          { label:'자동이체', val: _c.자동이체 },
        ].filter(i => i.val);
        items.forEach(i => {
          const sp = document.createElement('span');
          sp.className = 'cb-item';
          const safeVal = i.val.replace(/'/g, "\\'");
          sp.innerHTML = `<span class="cb-label">${i.label}:</span><span class="cb-val">${i.val}</span><button class="cb-copy" onclick="navigator.clipboard.writeText('${safeVal}');this.textContent='✓';setTimeout(()=>this.textContent='복사',1000)">복사</button>`;
          bar.appendChild(sp);
        });
        bar.classList.add('show');
      }
    }
  } catch(e) {}
}

document.getElementById('print-btn').addEventListener('click', () => {
  if (_issuanceId) {
    try {
      const lst = JSON.parse(localStorage.getItem('card_issuance_list') || '[]');
      const idx = lst.findIndex(e => e.id === _issuanceId);
      if (idx >= 0 && lst[idx].상태 !== '처리완료') {
        lst[idx].상태 = '처리완료';
        lst[idx].처리완료날짜 = new Date().toLocaleDateString('ko-KR');
        localStorage.setItem('card_issuance_list', JSON.stringify(lst));
      }
    } catch(e) {}
  }
  window.print();
});

const order = ['f-name','f-birth','f-phone','f-plan','f-monthly'];
order.forEach((id, i) => {
  const el = document.getElementById(id);
  const next = document.getElementById(order[i + 1]);
  if (el && next) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); next.focus(); } });
});

const FORM_IMG_KEY = 'fimg_' + encodeURIComponent(document.title);
(function(){
  ['','_p2'].forEach(function(sfx){
    var k = FORM_IMG_KEY + sfx;
    var imgId = sfx === '_p2' ? 'img2' : (document.getElementById('doc-img') ? 'doc-img' : 'img1');
    var el = document.getElementById(imgId) || document.querySelector('.doc-wrap img');
    if(!el) return;
    try { var s = localStorage.getItem(k); if(s){ el.src=s; var rb=document.getElementById('img-reset-btn'); if(rb)rb.style.display=''; } } catch(e){}
  });
})();
function replaceFormImage(input, imgId, sfx){
  var file = input.files[0]; if(!file) return;
  if(file.size > 8*1024*1024){ alert('파일이 8MB를 초과합니다. 더 작은 이미지를 사용해주세요.'); return; }
  var key = FORM_IMG_KEY + (sfx||'');
  var r = new FileReader();
  r.onload = function(ev){
    var el = document.getElementById(imgId||'doc-img') || document.querySelector('.doc-wrap img');
    if(el) el.src = ev.target.result;
    var rb = document.getElementById('img-reset-btn'); if(rb) rb.style.display = '';
    try { localStorage.setItem(key, ev.target.result); }
    catch(ex){ alert('저장 공간 부족 - 이번 세션에서만 적용됩니다.'); }
  };
  r.readAsDataURL(file); input.value = '';
}
function resetFormImage(){
  if(!confirm('기본 이미지로 복원할까요?')) return;
  try { [FORM_IMG_KEY, FORM_IMG_KEY+'_p2'].forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}
  location.reload();
}
</script>
<style>
#print-footer { max-width:900px; margin:0 auto; padding:7px 16px; background:#f1f5f9; border-top:1px solid #e2e7ec; font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:12px; color:#334155; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
#print-footer span { white-space:nowrap; }
#print-footer .pf-label { font-weight:700; color:#16283f; }
@media print { #print-footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #bbb; padding:4px 16px; font-size:11px; margin:0; max-width:none; } }
</style>
<div id="print-footer">
  <span><span class="pf-label">접수처:</span> 현성네트워크</span>
  <span><span class="pf-label">연락처:</span> 📞 043)216-0550 · 010-5835-7010</span>
  <span><span class="pf-label">날짜:</span> <span id="pf-date"></span></span>
  <span><span class="pf-label">시간:</span> <span id="pf-time"></span></span>
</div>
<script>
(function(){function pfUpdate(){var d=new Date();document.getElementById('pf-date').textContent=d.getFullYear()+'.'+(''+(d.getMonth()+1)).padStart(2,'0')+'.'+(''+d.getDate()).padStart(2,'0');document.getElementById('pf-time').textContent=(''+d.getHours()).padStart(2,'0')+':'+(''+d.getMinutes()).padStart(2,'0');}pfUpdate();setInterval(pfUpdate,30000);window.addEventListener('beforeprint',pfUpdate);})();
</script>

<script>
/* ===== 사용자/관리자 모드 구분 ===== */
(function(){
  var isAdmin = new URLSearchParams(location.search).has('edit');
  if(isAdmin) return;

  // 관리자 전용 버튼 숨기기
  ['check-btn'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.style.display='none';
  });
  var header = document.querySelector('header') || document.querySelector('.toolbar');
  if(!header) return;

  header.querySelectorAll('button, label').forEach(function(el){
    var t = el.textContent;
    if(t.indexOf('좌표') !== -1 || t.indexOf('이미지 교체') !== -1) el.style.display='none';
  });

  // T 텍스트 → ✏️ 자유입력 으로 변경하고 활성화 텍스트도 유지
  var tb = document.getElementById('text-btn');
  if(tb){
    tb.textContent = '✏️ 자유입력';
    // offAll() 이 텍스트를 'T 텍스트'로 되돌리는 것을 막기 위해 MutationObserver 사용
    var obs = new MutationObserver(function(){
      if(tb.textContent === 'T 텍스트') tb.textContent = '✏️ 자유입력';
      if(tb.textContent === 'T 끄기')   tb.textContent = '✏️ 끄기';
    });
    obs.observe(tb, {characterData:true, childList:true, subtree:true});
  }

  // 버튼 오른쪽 정렬: 남은 버튼들을 flex-end 그룹으로 묶기
  var btnGroup = document.createElement('div');
  btnGroup.style.cssText = 'display:flex;gap:8px;align-items:center;margin-left:auto;';
  var toMove = [];
  header.querySelectorAll('button, label').forEach(function(el){
    if(el.style.display !== 'none') toMove.push(el);
  });
  toMove.forEach(function(el){ btnGroup.appendChild(el); });
  header.appendChild(btnGroup);
})();
</script>
</body>
</html>
