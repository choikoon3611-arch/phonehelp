<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG U+ 제휴카드 장기할부 결제 신청서</title>
<style>
  * { box-sizing: border-box; }
  body { font-family:"Malgun Gothic","맑은 고딕",sans-serif; background:#ececec; margin:0; padding:20px; }

  /* ─── 고객 정보 바 ─── */
  .cust-bar { display:none; max-width:707px; margin:0 auto 10px; background:#dbeafe; border:1.5px solid #93c5fd; border-radius:10px; padding:10px 14px; font-size:12px; gap:10px; flex-wrap:wrap; align-items:center; }
  .cust-bar.show { display:flex; }
  .cust-bar .cb-title { font-weight:800; color:#1e3a8a; font-size:13px; flex-shrink:0; }
  .cust-bar .cb-item  { display:flex; align-items:center; gap:5px; color:#1e3a8a; }
  .cust-bar .cb-label { font-weight:700; white-space:nowrap; }
  .cb-copy { padding:2px 7px; font-size:11px; font-weight:700; border-radius:5px; border:1px solid #93c5fd; background:#fff; cursor:pointer; color:#1e3a8a; }
  .cb-copy:hover { background:#eff6ff; }

  /* ─── 툴바 ─── */
  .toolbar { max-width:707px; margin:0 auto 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .toolbar a { font-size:13px; color:#2f6feb; text-decoration:none; }
  .hdr-btn { padding:7px 13px; font-size:12px; font-weight:700; border:1.5px solid #ccc; border-radius:7px; background:#f8f8f8; color:#333; cursor:pointer; }
  .hdr-btn:hover { background:#e8f0fe; border-color:#4285f4; }
  .hdr-btn.active-text { background:#fde68a; border-color:#f59e0b; color:#78350f; }
  #print-btn { padding:9px 18px; font-size:13px; font-weight:700; border:none; border-radius:8px; background:#be185d; color:#fff; cursor:pointer; }

  /* ─── 문서 래퍼 ─── */
  .doc-wrap { position:relative; max-width:707px; margin:0 auto; background:#fff; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
  .doc-wrap img { display:block; width:100%; height:auto; }

  /* ─── 오버레이 입력 필드 ─── */
  .field {
    position:absolute; border:none;
    background:transparent; border-radius:2px;
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    font-size:15px; font-weight:700; color:#1a1a8c;
    padding:0 2px; outline:none;
    border-bottom:1px dashed rgba(26,26,140,0.4);
    overflow:visible; white-space:nowrap;
    transform:translateY(-50%); line-height:1;
  }
  .field:focus { background:rgba(255,255,255,0.95); border-bottom:1px solid #1a1a8c; box-shadow:0 0 0 1px #be185d,0 2px 6px rgba(0,0,0,0.25); z-index:50; }
  .field::placeholder { color:#aaa; font-size:0.82em; font-weight:400; }
  .field-sm { font-size:13px; }
  .field-xs { font-size:11px; letter-spacing:-0.2px; }

  /* ─── 체크박스 오버레이 ─── */
  .ck { position:absolute; width:16px; height:16px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#be185d; font-weight:900; cursor:move; transform:translate(-50%,-50%); user-select:none; }
  @media print { .ck { color:#000; } }

  /* ─── T 텍스트박스 ─── */
  .textbox { position:absolute; border:1px dashed rgba(0,120,255,0.7); background:rgba(255,255,200,0.55); outline:none; font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:13px; font-weight:700; color:#111; padding:0 3px; overflow:visible; white-space:nowrap; line-height:1.3; cursor:text; }
  .textbox:focus { background:rgba(255,255,200,0.9); border-color:#0078ff; }
  .sel-rect { position:absolute; border:2px dashed #0078ff; background:rgba(0,120,255,0.08); pointer-events:none; }

  /* ─── 인쇄 ─── */
  @media print {
    body { background:#fff; padding:0; }
    .toolbar,.cust-bar { display:none !important; }
    .doc-wrap { box-shadow:none; max-width:707px; width:707px; }
    .field { background:transparent; border-bottom:none; box-shadow:none; font-size:11pt; }
    .field-sm { font-size:9pt; }
    .field-xs { font-size:8pt; }
    .field::placeholder { color:transparent; }
    .textbox { border:none; background:transparent; }
    .ck { color:#000; }
  }
</style>
</head>
<body>

<div class="cust-bar" id="cust-bar">
  <span class="cb-title">📋 고객 정보</span>
</div>

<div class="toolbar">
  <a href="hub.html">← 허브로 돌아가기</a>
  <button class="hdr-btn" onclick="exportCoords()">📋 좌표 내보내기</button>
  <button class="hdr-btn" id="undo-btn">↩ 되돌리기</button>
  <label class="hdr-btn" style="cursor:pointer;display:inline-flex;align-items:center;" title="새 서류 이미지로 교체">🔄 이미지 교체<input type="file" accept="image/*" style="display:none;" onchange="replaceFormImage(this)"></label>
  <button class="hdr-btn" id="img-reset-btn" onclick="resetFormImage()" style="display:none;" title="원본 이미지로 복원">↺ 복원</button>
  <button id="print-btn">🖨 인쇄 / PDF 저장</button>
</div>

<div class="doc-wrap" id="wrap1">
  <img src="lg_제휴카드_p1.png" alt="LG U+ 제휴카드 장기할부 결제 신청서" id="doc-img">

  <!-- ══ 가입자 정보 ══ -->
  <input class="field" id="f-name"      style="left:23.23%; top:14.69%; width:24%;  height:2%;" placeholder="가입자명">
  <input class="field" id="f-birth"     style="left:69.51%; top:14.79%; width:22%;  height:2%;" placeholder="생년월일">
  <input class="field" id="f-phone"     style="left:23.08%; top:18.61%; width:24%;  height:2%;" placeholder="010-0000-0000">
  <input class="field" id="f-open-date" style="left:63.42%; top:18.72%; width:22%;  height:2%;" placeholder="개통일">


  <!-- ══ 카드 종류 체크 (수동) ══ -->
  <span class="ck" id="ck-shin" data-group="cardtype" style="left:35.08%; top:23.01%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-kook" data-group="cardtype" style="left:42.44%; top:23.12%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-hyun" data-group="cardtype" style="left:50.08%; top:23.01%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-hana" data-group="cardtype" style="left:57.58%; top:22.91%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-wuri" data-group="cardtype" style="left:65.50%; top:22.91%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-lott" data-group="cardtype" style="left:74.13%; top:23.01%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-sam"  data-group="cardtype" style="left:81.49%; top:23.01%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-nh"   data-group="cardtype" style="left:89.84%; top:23.12%;" onclick="toggleCkGroup(this)"></span>

  <!-- 카드 명의자 성명 / 생년월일 -->
  <input class="field" id="f-card-holder" style="left:31.71%; top:26.23%; width:26%; height:2%;" placeholder="카드 명의자 성명">
  <input class="field field-sm" id="f-card-birth" style="left:72.02%; top:26.55%; width:25%; height:2%;" placeholder="생년월일">

  <!-- 결제금액 -->
  <input class="field" id="f-amount" style="left:31.99%; top:29.94%; width:38%; height:2%;" placeholder="결제금액">

  <!-- 할부 개월 체크 (18/24/36) -->
  <span class="ck" id="ck-18" data-group="inst" data-label="18개월" style="left:72.81%; top:29.94%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-24" data-group="inst" data-label="24개월" style="left:81.46%; top:29.94%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-36" data-group="inst" data-label="36개월" style="left:90.47%; top:29.83%;" onclick="toggleCkGroup(this)"></span>

  <!-- 카드번호 + 유효기간 -->
  <input class="field field-sm" id="f-cnum1" style="left:28.74%; top:32.90%; width:12%; height:2%;" placeholder="0000">
  <input class="field field-sm" id="f-cnum2" style="left:41.05%; top:33.11%; width:12%; height:2%;" placeholder="0000">
  <input class="field field-sm" id="f-cnum3" style="left:50.25%; top:33.11%; width:12%; height:2%;" placeholder="0000">
  <input class="field field-sm" id="f-cnum4" style="left:63.00%; top:33.11%; width:12%; height:2%;" placeholder="0000">
  <input class="field field-sm" id="f-exp"   style="left:86.14%; top:33.43%; width:14%; height:2%;" placeholder="MM/YY">

  <!-- 구간할부 체크 -->
  <span class="ck" id="ck-g1"  data-group="guan" style="left:21%;   top:36.7%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-g2"  data-group="guan" style="left:33%;   top:36.7%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-wan" data-group="guan" style="left:51%;   top:36.7%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-bun" data-group="guan" style="left:65%;   top:36.7%;" onclick="toggleCkGroup(this)"></span>
  <input class="field field-sm" id="f-bun-month" style="left:59.87%; top:32.80%; width:10%; height:2%;" placeholder="">


  <!-- ══ 자동이체 등록 ══ -->
  <span class="ck" id="ck-auto-y" data-group="auto" data-label="신청" style="left:29.28%; top:62.97%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-auto-n" data-group="auto" data-label="미신청" style="left:40.36%; top:62.97%;" onclick="toggleCkGroup(this)"></span>

  <!-- ══ 하단 ══ -->
  <input class="field" id="f-store" style="left:14.86%; top:86.44%; width:42%; height:2%;" placeholder="매장명">
  <input class="field field-sm" id="f-year"  style="left:41.59%; top:89.83%; width:7%;  height:2%;" placeholder="년">
  <input class="field field-sm" id="f-month" style="left:51.46%; top:89.62%; width:5%;  height:2%;" placeholder="월">
  <input class="field field-sm" id="f-day"   style="left:57.76%; top:89.72%; width:5%;  height:2%;" placeholder="일">
  <span class="ck" id="ck-rcpt-y" data-group="rcpt" style="left:12.5%; top:93.5%;" onclick="toggleCkGroup(this)"></span>
  <span class="ck" id="ck-rcpt-n" data-group="rcpt" style="left:21%;   top:93.5%;" onclick="toggleCkGroup(this)"></span>
  <input class="field field-sm" id="f-fax" style="left:67.68%; top:93.28%; width:35%; height:2%;" placeholder="FAX 번호">

</div>

<script>
// ── 체크박스 ──────────────────────────────────
function toggleCkGroup(el) {
  var g = el.dataset.group;
  if (g) {
    document.querySelectorAll('.ck[data-group="'+g+'"]').forEach(function(c){ c.textContent=''; });
  }
  el.textContent = el.textContent === '✓' ? '' : '✓';
}

// ── 이미지 교체 / 복원 ────────────────────────
var FORM_IMG_KEY = 'fimg_' + encodeURIComponent(document.title);
(function(){
  var s; try { s = localStorage.getItem(FORM_IMG_KEY); } catch(e){}
  if (s) {
    var el = document.getElementById('doc-img');
    if (el) el.src = s;
    var rb = document.getElementById('img-reset-btn');
    if (rb) rb.style.display = '';
  }
})();
function replaceFormImage(input) {
  var file = input.files[0]; if (!file) return;
  if (file.size > 8*1024*1024) { alert('파일이 8MB를 초과합니다.'); return; }
  var r = new FileReader();
  r.onload = function(ev) {
    var el = document.getElementById('doc-img'); if (el) el.src = ev.target.result;
    var rb = document.getElementById('img-reset-btn'); if (rb) rb.style.display = '';
    try { localStorage.setItem(FORM_IMG_KEY, ev.target.result); } catch(ex) { alert('저장 공간 부족'); }
  };
  r.readAsDataURL(file); input.value = '';
}
function resetFormImage() {
  if (!confirm('기본 이미지로 복원할까요?')) return;
  try { localStorage.removeItem(FORM_IMG_KEY); } catch(e){}
  location.reload();
}

// ── 좌표 내보내기 (.field + .ck + .textbox 모두) ────
function exportCoords() {
  var wrap = document.getElementById('wrap1');
  var lines = [];
  wrap.querySelectorAll('.field').forEach(function(b) {
    var id = b.id || '(id없음)';
    var ph = b.placeholder || '';
    var l = parseFloat(b.style.left).toFixed(2);
    var t = parseFloat(b.style.top).toFixed(2);
    var w = parseFloat(b.style.width).toFixed(2);
    lines.push('#'+id+' ('+ph+'): left:'+l+'%, top:'+t+'%, width:'+w+'%');
  });
  wrap.querySelectorAll('.ck').forEach(function(b) {
    var id = b.id || '(id없음)';
    var l = parseFloat(b.style.left).toFixed(2);
    var t = parseFloat(b.style.top).toFixed(2);
    lines.push('[ck] #'+id+': left:'+l+'%, top:'+t+'%');
  });
  wrap.querySelectorAll('.textbox').forEach(function(b, i) {
    var l = parseFloat(b.style.left).toFixed(2);
    var t = parseFloat(b.style.top).toFixed(2);
    var w = parseFloat(b.style.width).toFixed(2);
    var h = parseFloat(b.style.minHeight).toFixed(2);
    lines.push('새박스'+(i+1)+': left:'+l+'%, top:'+t+'%, width:'+w+'%, height:'+h+'%');
  });
  if (!lines.length) { alert('필드가 없습니다.'); return; }
  var result = '📋 필드+체크박스 좌표\n' + lines.join('\n');
  var ta = document.createElement('textarea');
  ta.value = result;
  ta.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);width:640px;max-width:95vw;height:280px;z-index:9999;font-family:monospace;font-size:12px;padding:10px;border:2px solid #0078d4;border-radius:8px;resize:vertical;';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy');
  ta.addEventListener('blur', function(){ ta.remove(); });
  ta.addEventListener('keydown', function(e){ if (e.key==='Escape') ta.remove(); });
  alert('좌표가 클립보드에 복사됐습니다!\n(ESC 또는 바깥 클릭으로 닫힙니다)');
}

// ── 필드 드래그 이동 (항상 활성) ────────────────
(function(){
  var wrap = document.getElementById('wrap1');
  var img  = wrap.querySelector('img');
  var movingField = null, moveOffset = {x:0,y:0}, moveOrigPos = null, undoStack = [];
  var undoBtn = document.getElementById('undo-btn');

  // .field + .ck 모두 드래그 이동
  function initFields() {
    wrap.querySelectorAll('.field').forEach(function(f){
      f.style.cursor = 'move';
      f.addEventListener('mousedown', onFieldDown);
    });
    wrap.querySelectorAll('.ck').forEach(function(f){
      f.style.cursor = 'move';
      f.addEventListener('mousedown', onFieldDown);
    });
  }
  function onFieldDown(e) {
    // input 포커스 중(타이핑)일 때는 Shift 없으면 드래그 안 함
    if (e.currentTarget.tagName === 'INPUT' && document.activeElement === e.currentTarget && !e.shiftKey) return;
    e.preventDefault();
    var f = e.currentTarget;
    var r = wrap.getBoundingClientRect();
    var iw = wrap.offsetWidth, ih = img.offsetHeight;
    var fx = parseFloat(f.style.left)/100 * iw;
    var fy = parseFloat(f.style.top) /100 * ih;
    moveOffset = { x: e.clientX - r.left - fx, y: e.clientY - r.top - fy };
    moveOrigPos = { left: f.style.left, top: f.style.top };
    movingField = f;
    f.style.opacity = '0.6';
    f.style.outline = '2px solid #be185d';
  }

  window.addEventListener('mousemove', function(e){
    if (!movingField) return;
    var r = wrap.getBoundingClientRect();
    var iw = wrap.offsetWidth, ih = img.offsetHeight;
    var nx = e.clientX - r.left - moveOffset.x;
    var ny = e.clientY - r.top  - moveOffset.y;
    movingField.style.left = (nx/iw*100).toFixed(2)+'%';
    movingField.style.top  = (ny/ih*100).toFixed(2)+'%';
  });

  window.addEventListener('mouseup', function(){
    if (!movingField) return;
    movingField.style.opacity = '';
    movingField.style.outline = '';
    undoStack.push({ el: movingField, orig: moveOrigPos });
    movingField = null;
  });

  // 되돌리기
  function undo() {
    var last = undoStack.pop(); if (!last) return;
    last.el.style.left = last.orig.left;
    last.el.style.top  = last.orig.top;
  }
  if (undoBtn) undoBtn.addEventListener('click', undo);
  document.addEventListener('keydown', function(e){
    if (e.ctrlKey && e.key==='z') {
      var a = document.activeElement;
      if (a && a.tagName==='INPUT') return;
      e.preventDefault(); undo();
    }
  });

  initFields();
})();

// ── 고객 정보 자동 입력 ───────────────────────
(function(){
  var params = new URLSearchParams(window.location.search);
  var custId = params.get('id');
  if (!custId) return;
  try {
    // hub.html이 cardOpenDoc에서 card_entry_{id}로 저장해 줌
    var c = null;
    var raw = localStorage.getItem('card_entry_' + custId);
    if (raw) { c = JSON.parse(raw); }
    if (!c) {
      var list = JSON.parse(localStorage.getItem('card_issuance_list') || '[]');
      c = list.find(function(e){ return String(e.id) === custId; });
    }
    if (!c) return;
    var set = function(id, v){ var el=document.getElementById(id); if(el&&v) el.value=v; };
    set('f-name',  c.고객명 || c.name || '');
    set('f-birth', c.주민번호 || c.birth || '');
    set('f-phone', c.전화번호 || c.phone || '');
    set('f-card-holder', c.카드주이름 || c.고객명 || '');
    set('f-card-birth',  c.카드주주민번호 || c.주민번호 || '');
    if (c.카드번호) {
      var parts = c.카드번호.replace(/\s/g,'').split('-');
      set('f-cnum1', parts[0]||''); set('f-cnum2', parts[1]||'');
      set('f-cnum3', parts[2]||''); set('f-cnum4', parts[3]||'');
    }
    set('f-exp', c.유효기간 || '');
    set('f-amount', c.결제금액 || '');

    // 개월수 → 할부 체크박스 자동 선택
    if (c.개월수) {
      var monthMap = { '18': 'ck-18', '24': 'ck-24', '36': 'ck-36' };
      Object.keys(monthMap).forEach(function(m) {
        if (c.개월수.indexOf(m) !== -1) {
          var el = document.getElementById(monthMap[m]);
          if (el) el.textContent = '✓';
        }
      });
    }

    // 자동이체 → 자동이체 등록 체크박스 자동 선택
    if (c.자동이체) {
      var autoY = document.getElementById('ck-auto-y');
      var autoN = document.getElementById('ck-auto-n');
      if (c.자동이체.indexOf('요망') !== -1 && autoY) autoY.textContent = '✓';
      else if (c.자동이체.indexOf('안함') !== -1 && autoN) autoN.textContent = '✓';
    }

    var bar = document.getElementById('cust-bar');
    if (bar) {
      var items = [
        {label:'고객명',   val: c.고객명||c.name},
        {label:'전화번호', val: c.전화번호||c.phone},
        {label:'주민번호', val: c.주민번호||c.birth},
        {label:'카드번호', val: c.카드번호},
        {label:'유효기간', val: c.유효기간},
        {label:'결제금액', val: c.결제금액 ? c.결제금액+'원' : ''},
      ].filter(function(i){ return i.val; });
      items.forEach(function(i){
        var sp = document.createElement('span');
        sp.className = 'cb-item';
        var sv = (i.val||'').replace(/'/g,"\\'");
        sp.innerHTML = '<span class="cb-label">'+i.label+':</span><span class="cb-val">'+i.val+'</span><button class="cb-copy" onclick="navigator.clipboard.writeText(\''+sv+'\');this.textContent=\'✓\';setTimeout(()=>this.textContent=\'복사\',1000)">복사</button>';
        bar.appendChild(sp);
      });
      bar.classList.add('show');
    }
  } catch(e){}
})();

// ── 오늘 날짜 자동 입력 ───────────────────────
(function(){
  var t = new Date();
  var set = function(id, v){ var el=document.getElementById(id); if(el) el.value=v; };
  set('f-year',  t.getFullYear());
  set('f-month', String(t.getMonth()+1).padStart(2,'0'));
  set('f-day',   String(t.getDate()).padStart(2,'0'));
})();

// ── 인쇄 버튼 ────────────────────────────────
document.getElementById('print-btn').addEventListener('click', function(){ window.print(); });

// ── 관리자/사용자 모드 ────────────────────────
(function(){
  var isAdmin = new URLSearchParams(location.search).has('edit');
  if (isAdmin) return;
  var header = document.querySelector('.toolbar');
  if (!header) return;
  header.querySelectorAll('button, label').forEach(function(el){
    var t = el.textContent;
    if (t.indexOf('이미지 교체') !== -1 || t.indexOf('복원') !== -1) el.style.display = 'none';
  });
  var tb = document.getElementById('text-btn');
  if (tb) {
    tb.textContent = '✏️ 자유입력';
    var obs = new MutationObserver(function(){
      if (tb.textContent==='T 텍스트') tb.textContent='✏️ 자유입력';
      if (tb.textContent==='T 끄기')   tb.textContent='✏️ 끄기';
    });
    obs.observe(tb, {characterData:true, childList:true, subtree:true});
  }
})();
</script>
