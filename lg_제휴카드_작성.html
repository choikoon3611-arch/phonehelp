<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG U+ 제휴카드 장기할부 결제 신청서</title>
<style>
  * { box-sizing: border-box; }
  body { font-family:"Malgun Gothic","맑은 고딕",sans-serif; background:#ececec; margin:0; padding:20px; }

  /* ─── 고객 정보 바 ─── */
  .cust-bar { display:none; max-width:707px; margin:0 auto 10px; background:#dbeafe; border:1.5px solid #93c5fd; border-radius:10px; padding:10px 14px; font-size:12px; gap:10px; flex-wrap:wrap; align-items:center; }
  .cust-bar.show { display:flex; }
  .cust-bar .cb-title { font-weight:800; color:#1e3a8a; font-size:13px; flex-shrink:0; }
  .cust-bar .cb-item  { display:flex; align-items:center; gap:5px; color:#1e3a8a; }
  .cust-bar .cb-label { font-weight:700; white-space:nowrap; }
  .cb-copy { padding:2px 7px; font-size:11px; font-weight:700; border-radius:5px; border:1px solid #93c5fd; background:#fff; cursor:pointer; color:#1e3a8a; }
  .cb-copy:hover { background:#eff6ff; }

  /* ─── 툴바 ─── */
  .toolbar { max-width:707px; margin:0 auto 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .toolbar a { font-size:13px; color:#2f6feb; text-decoration:none; }
  .hdr-btn { padding:7px 13px; font-size:12px; font-weight:700; border:1.5px solid #ccc; border-radius:7px; background:#f8f8f8; color:#333; cursor:pointer; }
  .hdr-btn:hover { background:#e8f0fe; border-color:#4285f4; }
  .hdr-btn.active-text { background:#fde68a; border-color:#f59e0b; color:#78350f; }
  #print-btn { padding:9px 18px; font-size:13px; font-weight:700; border:none; border-radius:8px; background:#be185d; color:#fff; cursor:pointer; }

  /* ─── 문서 래퍼 ─── */
  .doc-wrap { position:relative; max-width:707px; margin:0 auto; background:#fff; box-shadow:0 4px 20px rgba(0,0,0,0.15); }
  .doc-wrap img { display:block; width:100%; height:auto; }

  /* ─── 오버레이 입력 필드 ─── */
  .field {
    position:absolute; border:none;
    background:rgba(255,235,59,0.28); border-radius:2px;
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    font-size:13px; font-weight:700; color:#1a1a8c;
    padding:0 2px; outline:none;
    border-bottom:1px dashed rgba(26,26,140,0.4);
    overflow:visible; white-space:nowrap;
    transform:translateY(-50%); line-height:1;
  }
  .field:focus { background:rgba(255,255,255,0.95); border-bottom:1px solid #1a1a8c; box-shadow:0 0 0 1px #be185d,0 2px 6px rgba(0,0,0,0.25); z-index:50; }
  .field::placeholder { color:#aaa; font-size:0.82em; font-weight:400; }
  .field-sm { font-size:10px; }
  .field-xs { font-size:9px; letter-spacing:-0.2px; }

  /* ─── 체크박스 오버레이 ─── */
  .ck { position:absolute; width:16px; height:16px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#be185d; font-weight:900; cursor:pointer; transform:translate(-50%,-50%); user-select:none; }

  /* ─── T 텍스트박스 ─── */
  .textbox { position:absolute; border:1px dashed rgba(0,120,255,0.7); background:rgba(255,255,200,0.55); outline:none; font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:13px; font-weight:700; color:#111; padding:0 3px; overflow:visible; white-space:nowrap; line-height:1.3; cursor:text; }
  .textbox:focus { background:rgba(255,255,200,0.9); border-color:#0078ff; }
  .sel-rect { position:absolute; border:2px dashed #0078ff; background:rgba(0,120,255,0.08); pointer-events:none; }

  /* ─── 인쇄 ─── */
  @media print {
    body { background:#fff; padding:0; }
    .toolbar,.cust-bar { display:none !important; }
    .doc-wrap { box-shadow:none; max-width:707px; width:707px; }
    .field { background:transparent; border-bottom:none; box-shadow:none; font-size:11pt; }
    .field-sm { font-size:9pt; }
    .field-xs { font-size:8pt; }
    .field::placeholder { color:transparent; }
    .textbox { border:none; background:transparent; }
    .ck { color:#000; }
  }
</style>
</head>
<body>

<div class="cust-bar" id="cust-bar">
  <span class="cb-title">📋 고객 정보</span>
</div>

<div class="toolbar">
  <a href="hub.html">← 허브로 돌아가기</a>

  <label class="hdr-btn" style="cursor:pointer;display:inline-flex;align-items:center;" title="새 서류 이미지로 교체">🔄 이미지 교체<input type="file" accept="image/*" style="display:none;" onchange="replaceFormImage(this)"></label>

<script>
// ── 체크박스 ──────────────────────────────────
function toggleCkGroup(el) {
  var g = el.dataset.group;
  if (g) {
    document.querySelectorAll('.ck[data-group="'+g+'"]').forEach(function(c){ c.textContent=''; });
  }
  el.textContent = el.textContent === '✓' ? '' : '✓';
}

// ── 이미지 교체 / 복원 ────────────────────────
var FORM_IMG_KEY = 'fimg_' + encodeURIComponent(document.title);
(function(){
  var s; try { s = localStorage.getItem(FORM_IMG_KEY); } catch(e){}
  if (s) {
    var el = document.getElementById('doc-img');
    if (el) el.src = s;
    var rb = document.getElementById('img-reset-btn');
    if (rb) rb.style.display = '';
  }
})();
function replaceFormImage(input) {
  var file = input.files[0]; if (!file) return;
  if (file.size > 8*1024*1024) { alert('파일이 8MB를 초과합니다.'); return; }
  var r = new FileReader();
  r.onload = function(ev) {
    var el = document.getElementById('doc-img'); if (el) el.src = ev.target.result;
    var rb = document.getElementById('img-reset-btn'); if (rb) rb.style.display = '';
    try { localStorage.setItem(FORM_IMG_KEY, ev.target.result); } catch(ex) { alert('저장 공간 부족'); }
  };
  r.readAsDataURL(file); input.value = '';
}
function resetFormImage() {
  if (!confirm('기본 이미지로 복원할까요?')) return;
  try { localStorage.removeItem(FORM_IMG_KEY); } catch(e){}
  location.reload();
}

// ── 좌표 내보내기 ─────────────────────────────
function exportCoords() {
  var wrap = document.getElementById('wrap1');
  var boxes = wrap.querySelectorAll('.textbox');
  if (!boxes.length) { alert('T 텍스트 모드로 칸을 먼저 드래그해 주세요.'); return; }
  var lines = [];
  boxes.forEach(function(b, i) {
    var l = parseFloat(b.style.left).toFixed(2);
    var t = parseFloat(b.style.top).toFixed(2);
    var w = parseFloat(b.style.width).toFixed(2);
    var h = parseFloat(b.style.minHeight).toFixed(2);
    lines.push('필드 '+(i+1)+': left:'+l+'%, top:'+t+'%, width:'+w+'%, height:'+h+'%');
  });
  var result = '📋 텍스트박스 좌표\n' + lines.join('\n');
  var ta = document.createElement('textarea');
  ta.value = result;
  ta.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);width:600px;max-width:95vw;height:200px;z-index:9999;font-family:monospace;font-size:13px;padding:10px;border:2px solid #0078d4;border-radius:8px;resize:vertical;';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy');
  ta.addEventListener('blur', function(){ ta.remove(); });
  ta.addEventListener('keydown', function(e){ if (e.key==='Escape') ta.remove(); });
  alert('좌표가 클립보드에 복사됐습니다!\nClaude에게 붙여넣기 하세요.\n(ESC 또는 바깥 클릭으로 닫힙니다)');
}

// ── T 텍스트 / 되돌리기 ───────────────────────
(function(){
  var textBtn = document.getElementById('text-btn');
  var undoBtn = document.getElementById('undo-btn');
  if (!textBtn || !undoBtn) return;
  var textOn = false, textBoxes = [], dragStart = null, selRect = null, undoStack = [];

  textBtn.addEventListener('click', function(){
    textOn = !textOn;
    textBtn.classList.toggle('active-text', textOn);
    textBtn.textContent = textOn ? 'T 끄기' : 'T 텍스트';
    var wrap = document.getElementById('wrap1');
    wrap.style.cursor = textOn ? 'crosshair' : '';
    wrap.style.userSelect = textOn ? 'none' : '';
  });

  var wrap = document.getElementById('wrap1');
  wrap.addEventListener('mousedown', function(e){
    if (!textOn || e.target.closest('.textbox')) return;
    e.preventDefault();
    var r = wrap.getBoundingClientRect();
    dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
    selRect = document.createElement('div'); selRect.className = 'sel-rect';
    selRect.style.left = dragStart.x + 'px'; selRect.style.top = dragStart.y + 'px';
    wrap.appendChild(selRect);
  });

  window.addEventListener('mousemove', function(e){
    if (!textOn || !dragStart) return;
    var r = wrap.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    var x = Math.min(dragStart.x, cx), y = Math.min(dragStart.y, cy);
    selRect.style.left = x+'px'; selRect.style.top = y+'px';
    selRect.style.width = Math.abs(cx-dragStart.x)+'px';
    selRect.style.height = Math.abs(cy-dragStart.y)+'px';
  });

  window.addEventListener('mouseup', function(e){
    if (!textOn || !dragStart) return;
    var img = wrap.querySelector('img');
    var r = wrap.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    var x = Math.min(dragStart.x, cx), y = Math.min(dragStart.y, cy);
    var ww = Math.abs(cx-dragStart.x), h = Math.abs(cy-dragStart.y);
    selRect.remove(); selRect = null; dragStart = null;
    if (ww < 10 || h < 6) return;
    var iw = wrap.offsetWidth, ih = img.offsetHeight;
    var box = document.createElement('div');
    box.className = 'textbox'; box.contentEditable = 'true';
    box.style.left = (x/iw*100)+'%'; box.style.top = (y/ih*100)+'%';
    box.style.width = (ww/iw*100)+'%'; box.style.minHeight = (h/ih*100)+'%';
    box.addEventListener('keydown', function(ev){
      if ((ev.key==='Delete'||ev.key==='Backspace') && box.textContent==='') {
        ev.preventDefault(); box.remove();
        textBoxes = textBoxes.filter(function(b){ return b !== box; });
      }
    });
    wrap.appendChild(box); textBoxes.push(box); box.focus();
    undoStack.push({ type:'textbox', el:box });
  });

  function undo() {
    var last = undoStack.pop(); if (!last) return;
    if (last.type === 'textbox') {
      last.el.remove();
      textBoxes = textBoxes.filter(function(b){ return b !== last.el; });
    }
  }
  undoBtn.addEventListener('click', undo);
  document.addEventListener('keydown', function(e){
    if (e.ctrlKey && e.key==='z') {
      var a = document.activeElement;
      if (a && (a.tagName==='INPUT' || a.contentEditable==='true')) return;
      e.preventDefault(); undo();
    }
  });
})();

// ── 고객 정보 자동 입력 ───────────────────────
(function(){
  var params = new URLSearchParams(window.location.search);
  var custId = params.get('id');
  if (!custId) return;
  try {
    var list = JSON.parse(localStorage.getItem('issuance_list') || '[]');
    var c = list.find(function(e){ return String(e.id) === custId; });
    if (!c) {
      list = JSON.parse(localStorage.getItem('card_issuance_list') || '[]');
      c = list.find(function(e){ return String(e.id) === custId; });
    }
    if (!c) return;
    var set = function(id, v){ var el=document.getElementById(id); if(el&&v) el.value=v; };
    set('f-name',  c.고객명 || c.name || '');
    set('f-birth', c.주민번호 || c.birth || '');
    set('f-phone', c.전화번호 || c.phone || '');
    set('f-card-holder', c.카드주이름 || c.고객명 || '');
    set('f-card-birth',  c.카드주주민번호 || c.주민번호 || '');
    if (c.카드번호) {
      var parts = c.카드번호.replace(/\s/g,'').split('-');
      set('f-cnum1', parts[0]||''); set('f-cnum2', parts[1]||'');
      set('f-cnum3', parts[2]||'');
    }
    set('f-exp', c.유효기간 || '');
    set('f-amount', c.결제금액 || '');

    var bar = document.getElementById('cust-bar');
    if (bar) {
      var items = [
        {label:'고객명',   val: c.고객명||c.name},
        {label:'전화번호', val: c.전화번호||c.phone},
        {label:'주민번호', val: c.주민번호||c.birth},
        {label:'카드번호', val: c.카드번호},
        {label:'유효기간', val: c.유효기간},
        {label:'결제금액', val: c.결제금액 ? c.결제금액+'원' : ''},
      ].filter(function(i){ return i.val; });
      items.forEach(function(i){
        var sp = document.createElement('span');
        sp.className = 'cb-item';
        var sv = (i.val||'').replace(/'/g,"\\'");
        sp.innerHTML = '<span class="cb-label">'+i.label+':</span><span class="cb-val">'+i.val+'</span><button class="cb-copy" onclick="navigator.clipboard.writeText(\''+sv+'\');this.textContent=\'✓\';setTimeout(()=>this.textContent=\'복사\',1000)">복사</button>';
        bar.appendChild(sp);
      });
      bar.classList.add('show');
    }
  } catch(e){}
})();

// ── 오늘 날짜 자동 입력 ───────────────────────
(function(){
  var t = new Date();
  var set = function(id, v){ var el=document.getElementById(id); if(el) el.value=v; };
  set('f-year',  t.getFullYear());
  set('f-month', String(t.getMonth()+1).padStart(2,'0'));
  set('f-day',   String(t.getDate()).padStart(2,'0'));
})();

// ── 인쇄 버튼 ────────────────────────────────
document.getElementById('print-btn').addEventListener('click', function(){ window.print(); });

// ── 관리자/사용자 모드 ────────────────────────
(function(){
  var isAdmin = new URLSearchParams(location.search).has('edit');
  if (isAdmin) return;
  var header = document.querySelector('.toolbar');
  if (!header) return;
  header.querySelectorAll('button, label').forEach(function(el){
    var t = el.textContent;
    if (t.indexOf('좌표') !== -1 || t.indexOf('이미지 교체') !== -1 || t.indexOf('복원') !== -1) el.style.display = 'none';
  });
  var tb = document.getElementById('text-btn');
  if (tb) {
    tb.textContent = '✏️ 자유입력';
    var obs = new MutationObserver(function(){
      if (tb.textContent==='T 텍스트') tb.textContent='✏️ 자유입력';
      if (tb.textContent==='T 끄기')   tb.textContent='✏️ 끄기';
    });
    obs.observe(tb, {characterData:true, childList:true, subtree:true});
  }
})();
</script>
