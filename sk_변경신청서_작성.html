<title>SK 변경신청서 작성</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #ececec;
    margin: 0;
    padding: 20px;
  }
  .toolbar {
    max-width: 700px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .toolbar a {
    font-size: 13px;
    color: #2f6feb;
    text-decoration: none;
  }
  .toolbar button {
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    background: #16283f;
    color: #fff;
    cursor: pointer;
  }

  .doc-wrap {
    position: relative;
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .doc-wrap img {
    display: block;
    width: 100%;
    height: auto;
  }

  .overlay-input {
    position: absolute;
    transform: translate(0, -50%);
    border: none;
    background: transparent;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: min(2.2vw, 15px);
    font-weight: 700;
    color: #1a1a8c;
    padding: 0;
    outline: none;
    border-bottom: 1px dashed transparent;
  }
  .overlay-input:focus {
    border-bottom: 1px dashed #1a1a8c;
  }
  .overlay-input::placeholder {
    color: #bbb;
    font-size: 0.9em;
    font-weight: 400;
  }
  .overlay-input-big {
    font-size: 2.4vw;
    font-weight: 700;
    white-space: normal;
    word-break: keep-all;
    line-height: 1.25;
    resize: none;
    overflow: hidden;
  }

  .cust-bar {
    display: none; max-width: 700px; margin: 0 auto 10px;
    background: #dbeafe; border: 1.5px solid #93c5fd; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .cust-bar.show { display: flex; }
  .cust-bar .cb-title { font-weight: 800; color: #1e3a8a; font-size: 13px; flex-shrink:0; }
  .cust-bar .cb-item { display: flex; align-items: center; gap: 5px; color: #1e3a8a; }
  .cust-bar .cb-label { font-weight: 700; white-space: nowrap; }
  .cust-bar .cb-val { font-weight: 400; }
  .cb-copy {
    padding: 2px 7px; font-size: 11px; font-weight: 700; border-radius: 5px;
    border: 1px solid #93c5fd; background: #fff; cursor: pointer; color: #1e3a8a;
  }
  .cb-copy:hover { background: #eff6ff; }

    .textbox {
    position:absolute; border:1px dashed rgba(0,120,255,0.7); background:rgba(255,255,200,0.55);
    outline:none; font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    font-size:13px; font-weight:700; color:#111;
    padding:0 3px; overflow:hidden; line-height:1.3; cursor:text;
  }
  .textbox:focus { background:rgba(255,255,200,0.9); border-color:#0078ff; }
  .sel-rect { position:absolute; border:2px dashed #0078ff; background:rgba(0,120,255,0.08); pointer-events:none; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .cust-bar { display: none !important; }
    .doc-wrap { box-shadow: none; max-width: 100%; }
    .overlay-input {
      color: #000;
      font-size: 11pt;
      font-weight: 700;
    }
    .overlay-input-big {
      font-size: 13pt;
      font-weight: 700;
    }
  }
  .field { position:absolute; border:1px solid rgba(230,0,45,0.45); background:rgba(255,236,179,0.55); border-radius:3px; font-family:"Malgun Gothic","맑은 고딕",sans-serif; color:#16283f; font-weight:700; padding:0 4px; outline:none; font-size:13px; transform:translateY(-50%); }
  .field:focus { background:rgba(255,236,179,0.95); border-color:#e6002d; z-index:20; }
</style>

<script>
var _pb=document.getElementById('print-btn'); if(_pb) _pb.addEventListener('click', () => { window.print(); });

// 엔터키 누르면 이동전화번호 → 이름 → 법정생년월일 순으로 커서 이동
const fPhone = document.getElementById('f-phone');
const fName = document.getElementById('f-name');
const fBirth = document.getElementById('f-birth');
const fCustom = document.getElementById('f-custom');

function onEnterGoTo(el, nextEl) {
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (nextEl) {
        nextEl.focus();
        nextEl.select();
      } else {
        el.blur();
      }
    }
  });
}

if(fPhone && fName) onEnterGoTo(fPhone, fName);
if(fName && fBirth) onEnterGoTo(fName, fBirth);
if(fBirth && fCustom) onEnterGoTo(fBirth, fCustom);
if(fCustom) onEnterGoTo(fCustom, null);

const FORM_IMG_KEY = 'fimg_' + encodeURIComponent(document.title);
(function(){
  ['','_p2'].forEach(function(sfx){
    var k = FORM_IMG_KEY + sfx;
    var imgId = sfx === '_p2' ? 'img2' : (document.getElementById('doc-img') ? 'doc-img' : 'img1');
    var el = document.getElementById(imgId) || document.querySelector('.doc-wrap img');
    if(!el) return;
    try { var s = localStorage.getItem(k); if(s){ el.src=s; var rb=document.getElementById('img-reset-btn'); if(rb)rb.style.display=''; } } catch(e){}
  });
})();
function replaceFormImage(input, imgId, sfx){
  var file = input.files[0]; if(!file) return;
  if(file.size > 8*1024*1024){ alert('파일이 8MB를 초과합니다. 더 작은 이미지를 사용해주세요.'); return; }
  var key = FORM_IMG_KEY + (sfx||'');
  var r = new FileReader();
  r.onload = function(ev){
    var el = document.getElementById(imgId||'doc-img') || document.querySelector('.doc-wrap img');
    if(el) el.src = ev.target.result;
    var rb = document.getElementById('img-reset-btn'); if(rb) rb.style.display = '';
    try { localStorage.setItem(key, ev.target.result); }
    catch(ex){ alert('저장 공간 부족 - 이번 세션에서만 적용됩니다.'); }
  };
  r.readAsDataURL(file); input.value = '';
}
function resetFormImage(){
  if(!confirm('기본 이미지로 복원할까요?')) return;
  try { [FORM_IMG_KEY, FORM_IMG_KEY+'_p2'].forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}
  location.reload();
}

// ── T 텍스트 / 되돌리기 ──
(function(){
  var textBtn=document.getElementById('text-btn');
  var undoBtn=document.getElementById('undo-btn');
  if(!textBtn||!undoBtn)return;
  var textOn=false,textBoxes=[],dragStart=null,selRect=null,undoStack=[];
  textBtn.addEventListener('click',function(){
    textOn=!textOn;
    textBtn.classList.toggle('active-text',textOn);
    textBtn.textContent=textOn?'T 끄기':'T 텍스트';
    document.querySelectorAll('.doc-wrap').forEach(function(w){
      w.style.cursor=textOn?'crosshair':'';w.style.userSelect=textOn?'none':'';
    });
  });
  document.querySelectorAll('.doc-wrap').forEach(function(wrap){
    var img=wrap.querySelector('img');
    wrap.addEventListener('mousedown',function(e){
      if(!textOn||e.target.closest('.textbox'))return;
      e.preventDefault();var r=wrap.getBoundingClientRect();
      dragStart={x:e.clientX-r.left,y:e.clientY-r.top,wrap:wrap};
      selRect=document.createElement('div');selRect.className='sel-rect';
      selRect.style.left=dragStart.x+'px';selRect.style.top=dragStart.y+'px';
      wrap.appendChild(selRect);
    });
  });
  window.addEventListener('mousemove',function(e){
    if(!textOn||!dragStart)return;
    var r=dragStart.wrap.getBoundingClientRect();
    var cx=e.clientX-r.left,cy=e.clientY-r.top;
    var x=Math.min(dragStart.x,cx),y=Math.min(dragStart.y,cy);
    selRect.style.left=x+'px';selRect.style.top=y+'px';
    selRect.style.width=Math.abs(cx-dragStart.x)+'px';selRect.style.height=Math.abs(cy-dragStart.y)+'px';
  });
  window.addEventListener('mouseup',function(e){
    if(!textOn||!dragStart)return;
    var wrap=dragStart.wrap,img=wrap.querySelector('img');
    var r=wrap.getBoundingClientRect();
    var cx=e.clientX-r.left,cy=e.clientY-r.top;
    var x=Math.min(dragStart.x,cx),y=Math.min(dragStart.y,cy);
    var ww=Math.abs(cx-dragStart.x),h=Math.abs(cy-dragStart.y);
    selRect.remove();selRect=null;dragStart=null;
    if(ww<10||h<6)return;
    var iw=wrap.offsetWidth,ih=img.offsetHeight;
    var box=document.createElement('div');box.className='textbox';box.contentEditable='true';
    box.style.left=(x/iw*100)+'%';box.style.top=(y/ih*100)+'%';
    box.style.width=(ww/iw*100)+'%';box.style.minHeight=(h/ih*100)+'%';
    box.addEventListener('keydown',function(ev){
      if((ev.key==='Delete'||ev.key==='Backspace')&&box.textContent===''){ev.preventDefault();box.remove();textBoxes=textBoxes.filter(function(b){return b!==box;});}
    });
    wrap.appendChild(box);textBoxes.push(box);box.focus();
    undoStack.push({type:'textbox',el:box});
  });
  function undo(){var last=undoStack.pop();if(!last)return;if(last.type==='textbox'){last.el.remove();textBoxes=textBoxes.filter(function(b){return b!==last.el;});}}
  undoBtn.addEventListener('click',undo);
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey&&e.key==='z'){var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.contentEditable==='true'))return;e.preventDefault();undo();}
  });


})();
function exportCoords(){
  var wrap=document.getElementById('doc-wrap');
  var boxes=wrap.querySelectorAll('.textbox');
  if(!boxes.length){alert('배치된 텍스트박스가 없습니다.\nT 텍스트 모드로 칸을 먼저 만들어주세요.');return;}
  var lines=[];
  boxes.forEach(function(b,i){
    var l=parseFloat(b.style.left).toFixed(2);
    var t=parseFloat(b.style.top).toFixed(2);
    var w=parseFloat(b.style.width).toFixed(2);
    var h=parseFloat(b.style.minHeight).toFixed(2);
    lines.push('필드 '+(i+1)+': left:'+l+'%, top:'+t+'%, width:'+w+'%, height:'+h+'%');
  });
  var result='📋 텍스트박스 좌표\n'+lines.join('\n');
  var ta=document.createElement('textarea');
  ta.value=result;
  ta.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);width:600px;max-width:95vw;height:200px;z-index:9999;font-family:monospace;font-size:13px;padding:10px;border:2px solid #e6002d;border-radius:8px;resize:vertical;';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.addEventListener('blur',function(){ta.remove();});
  ta.addEventListener('keydown',function(e){if(e.key==='Escape')ta.remove();});
  alert('좌표가 클립보드에 복사됐습니다!\n아래 창을 Claude에게 붙여넣기 하세요.\n(ESC 또는 클릭 밖으로 나가면 닫힙니다)');
}

<script>
/* ===== 사용자/관리자 모드 구분 ===== */
(function(){
  var isAdmin = new URLSearchParams(location.search).has('edit');
  if(isAdmin) return;

  // 관리자 전용 버튼 숨기기
  ['check-btn'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.style.display='none';
  });
  var header = document.querySelector('header') || document.querySelector('.toolbar');
  if(!header) return;

  header.querySelectorAll('button, label').forEach(function(el){
    var t = el.textContent;
    if(t.indexOf('좌표') !== -1 || t.indexOf('이미지 교체') !== -1) el.style.display='none';
  });

  // T 텍스트 → ✏️ 자유입력 으로 변경하고 활성화 텍스트도 유지
  var tb = document.getElementById('text-btn');
  if(tb){
    tb.textContent = '✏️ 자유입력';
    // offAll() 이 텍스트를 'T 텍스트'로 되돌리는 것을 막기 위해 MutationObserver 사용
    var obs = new MutationObserver(function(){
      if(tb.textContent === 'T 텍스트') tb.textContent = '✏️ 자유입력';
      if(tb.textContent === 'T 끄기')   tb.textContent = '✏️ 끄기';
    });
    obs.observe(tb, {characterData:true, childList:true, subtree:true});
  }

  // 버튼 오른쪽 정렬: 남은 버튼들을 flex-end 그룹으로 묶기
  var btnGroup = document.createElement('div');
  btnGroup.style.cssText = 'display:flex;gap:8px;align-items:center;margin-left:auto;';
  var toMove = [];
  header.querySelectorAll('button, label').forEach(function(el){
    if(el.style.display !== 'none') toMove.push(el);
  });
  toMove.forEach(function(el){ btnGroup.appendChild(el); });
  header.appendChild(btnGroup);
})();
</script>
</body>
</html>
