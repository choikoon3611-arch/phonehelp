<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SK 유선 서식지</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;overflow:hidden;}
.toolbar{background:#16283f;color:#fff;height:42px;padding:0 14px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:500;}
.toolbar a{color:#93c5fd;font-size:13px;text-decoration:none;}
.toolbar .title{flex:1;font-size:14px;font-weight:700;}
.toolbar button{padding:5px 13px;border:none;border-radius:6px;background:#3b82f6;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.app{display:flex;height:calc(100vh - 42px);margin-top:42px;}
.sidebar{width:280px;flex-shrink:0;background:#f8fafc;border-right:2px solid #e2e8f0;overflow-y:auto;display:flex;flex-direction:column;}
.sb-sec{padding:10px 12px;border-bottom:1px solid #e2e8f0;}
.sb-ttl{font-size:10px;font-weight:800;color:#6366f1;letter-spacing:.5px;margin-bottom:7px;}
.sb-field{margin-bottom:6px;}
.sb-field label{font-size:10px;font-weight:700;color:#94a3b8;display:block;margin-bottom:2px;}
.sb-field input{width:100%;height:27px;padding:0 8px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12.5px;font-family:'Malgun Gothic',sans-serif;color:#1e293b;background:#fff;}
.sb-field input:focus{border-color:#6366f1;outline:none;background:#f5f3ff;}
.plan-btns{display:flex;flex-wrap:wrap;gap:4px;}
.plan-btn{padding:3px 9px;border:1.5px solid #e2e8f0;border-radius:14px;background:#fff;font-size:11px;font-weight:700;color:#475569;cursor:pointer;transition:.1s;}
.plan-btn:hover{border-color:#6366f1;color:#6366f1;}
.plan-btn.on{border-color:#dc2626;background:#dc2626;color:#fff;}
.sb-sub{font-size:10px;font-weight:800;color:#6366f1;letter-spacing:.5px;margin:8px 0 5px;}
.copy-btn{width:100%;padding:9px;border:2px dashed #6366f1;border-radius:9px;background:#f5f3ff;color:#4338ca;font-size:12px;font-weight:800;cursor:pointer;font-family:'Malgun Gothic',sans-serif;margin-bottom:5px;}
.copy-btn:hover{background:#ede9fe;}
.reset-btn{width:100%;padding:6px;border:1px solid #e2e8f0;border-radius:7px;background:#fff;color:#94a3b8;font-size:11px;cursor:pointer;font-family:'Malgun Gothic',sans-serif;}
.reset-btn:hover{background:#f1f5f9;}
#notice{font-size:11px;font-weight:700;text-align:center;padding:4px;border-radius:5px;opacity:0;transition:opacity .3s;margin-top:4px;color:#16a34a;white-space:pre-line;}
.hint{font-size:10px;color:#94a3b8;margin-top:6px;line-height:1.6;}
.hint b{color:#6366f1;}
.main{flex:1;overflow-y:auto;background:#e8edf2;padding:10px;}
.form-section{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;margin-bottom:10px;}
.form-ttl{background:#e0e7ff;padding:8px 16px;font-size:12px;font-weight:800;color:#4338ca;border-left:5px solid #6366f1;}
.doc-wrap{position:relative;width:794px;max-width:100%;margin:0 auto;}
.doc-wrap img{display:block;width:100%;height:auto;}
.ft{position:absolute;display:block;transform:translateY(-50%);font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:12.5px;font-weight:700;color:#1a1a8c;white-space:nowrap;line-height:1;pointer-events:all;cursor:grab;z-index:10;min-width:12px;min-height:14px;}
.ft:empty{background:rgba(99,102,241,.07);outline:1px dashed rgba(99,102,241,.4);min-width:28px;}
.ft:active{cursor:grabbing;}
.ft:hover{outline:1px solid rgba(99,102,241,.55);background:rgba(99,102,241,.06);}
.dm{position:absolute;transform:translate(-50%,-50%);font-size:20px;font-weight:900;color:#dc2626;cursor:grab;z-index:50;user-select:none;line-height:1;text-shadow:0 0 3px rgba(255,255,255,.9);}
.dm:active{cursor:grabbing;}
#dinfo{position:fixed;bottom:14px;right:14px;background:rgba(15,23,42,.92);color:#60a5fa;font-size:13px;font-family:monospace;font-weight:700;padding:8px 16px;border-radius:10px;z-index:999;display:none;max-width:380px;}
@media print{
  body{overflow:visible;}
  .toolbar,.sidebar,#dinfo{display:none!important;}
  .app{display:block;height:auto;margin-top:0;}
  .main{overflow:visible;padding:0;background:#fff;}
  .form-section{margin:0;box-shadow:none;border-radius:0;page-break-after:always;}
  .form-ttl{display:none;}
  .doc-wrap{width:794px;}
  .ft{font-size:10pt;pointer-events:none;outline:none!important;cursor:default;}
  .dm{display:none;}
}
</style>
</head>
<body>

<div class="toolbar">
  <a href="hub.html">← 허브</a>
  <span class="title">SK 유선 서식지</span>
  <button onclick="window.print()">🖨️ 인쇄</button>
</div>

<div class="app">
<div class="sidebar">

  <div class="sb-sec">
    <div class="sb-ttl">👤 기본 고객 정보</div>
    <div class="sb-field"><label>고객명</label><input id="p-name" oninput="sync(this)"></div>
    <div class="sb-field"><label>법정생년월일</label><input id="p-birth" oninput="sync(this)"></div>
    <div class="sb-field"><label>연락처 (전화)</label><input id="p-tel" oninput="sync(this)"></div>
    <div class="sb-field"><label>연락처 (휴대폰)</label><input id="p-mobile" oninput="sync(this)"></div>
    <div class="sb-field"><label>설치장소 (주소)</label><input id="p-addr" oninput="sync(this)"></div>
  </div>

  <div class="sb-sec">
    <div class="sb-ttl">🏦 예금주 / 자동이체 정보</div>
    <div class="sb-field"><label>예금주명</label><input id="p-yegeum" oninput="sync(this)"></div>
    <div class="sb-field"><label>은행</label><input id="p-bank" oninput="sync(this)"></div>
    <div class="sb-field"><label>계좌번호</label><input id="p-account" oninput="sync(this)"></div>
    <div class="sb-field"><label>법정생년월일</label><input id="p-birth2" oninput="sync(this)"></div>
    <div class="sb-field"><label>이동전화번호</label><input id="p-mtel2" oninput="sync(this)"></div>
  </div>

  <div class="sb-sec">
    <div class="sb-ttl">👨‍👩‍👦 법정대리인</div>
    <div class="sb-field"><label>이름</label><input id="p-legal" oninput="sync(this)"></div>
    <div class="sb-field"><label>신청고객과의관계</label><input id="p-rel" oninput="sync(this)"></div>
    <div class="sb-field"><label>법정생년월일</label><input id="p-birth3" oninput="sync(this)"></div>
    <div class="sb-field"><label>이동전화번호</label><input id="p-mtel3" oninput="sync(this)"></div>
  </div>

  <div class="sb-sec">
    <div class="sb-ttl">📡 인터넷 요금제 <span style="font-weight:400;color:#94a3b8;font-size:9px">(누르면 ✔ 생성 / 다시 누르면 제거)</span></div>
    <div class="plan-btns">
      <button class="plan-btn" data-g="inet" data-k="direct"  onclick="sel(this)">다이렉트</button>
      <button class="plan-btn" data-g="inet" data-k="glight"  onclick="sel(this)">기가라이트인터넷</button>
      <button class="plan-btn" data-g="inet" data-k="giga"    onclick="sel(this)">기가인터넷</button>
      <button class="plan-btn" data-g="inet" data-k="gmulti"  onclick="sel(this)">기가인터넷멀티</button>
      <button class="plan-btn" data-g="inet" data-k="gwifi"   onclick="sel(this)">광랜인터넷와이파이</button>
      <button class="plan-btn" data-g="inet" data-k="glwifi"  onclick="sel(this)">기가라이트인터넷와이파이</button>
      <button class="plan-btn" data-g="inet" data-k="giwifi"  onclick="sel(this)">기가인터넷와이파이</button>
      <button class="plan-btn" data-g="inet" data-k="p25"     onclick="sel(this)">기가프리미엄X2.5</button>
      <button class="plan-btn" data-g="inet" data-k="p5"      onclick="sel(this)">기가프리미엄X5</button>
      <button class="plan-btn" data-g="inet" data-k="p10"     onclick="sel(this)">기가프리미엄X10</button>
    </div>
    <div class="sb-sub">📶 WiFi</div>
    <div class="plan-btns">
      <button class="plan-btn" data-g="wifi" data-k="g7" onclick="sel(this)">Giga WiFi 7</button>
      <button class="plan-btn" data-g="wifi" data-k="g"  onclick="sel(this)">Giga WiFi(기본형)</button>
    </div>
    <div class="sb-sub">📋 정기계약</div>
    <div class="plan-btns">
      <button class="plan-btn" data-g="term" data-k="4y"   onclick="sel(this)">4년</button>
      <button class="plan-btn" data-g="term" data-k="3y"   onclick="sel(this)">3년</button>
      <button class="plan-btn" data-g="term" data-k="2y"   onclick="sel(this)">2년</button>
      <button class="plan-btn" data-g="term" data-k="1y"   onclick="sel(this)">1년</button>
      <button class="plan-btn" data-g="term" data-k="free" onclick="sel(this)">무약정</button>
    </div>
  </div>

  <div class="sb-sec">
    <div class="sb-ttl">📺 B tv</div>
    <div class="sb-sub" style="margin-top:0">요금제</div>
    <div class="plan-btns">
      <button class="plan-btn" data-g="btv" data-k="allp"  onclick="sel(this)">B tv All+</button>
      <button class="plan-btn" data-g="btv" data-k="stdp"  onclick="sel(this)">B tv 스탠다드+</button>
      <button class="plan-btn" data-g="btv" data-k="nflxp" onclick="sel(this)">넷플릭스 프리미엄</button>
      <button class="plan-btn" data-g="btv" data-k="nflxs" onclick="sel(this)">넷플릭스 스탠다드</button>
    </div>
    <div class="sb-sub">약정</div>
    <div class="plan-btns">
      <button class="plan-btn" data-g="bterm" data-k="3y"  onclick="sel(this)">3년</button>
      <button class="plan-btn" data-g="bterm" data-k="etc" onclick="sel(this)">기타</button>
    </div>
  </div>

  <div class="sb-sec">
    <button class="copy-btn" onclick="copyAll()">📋 전체 좌표 복사 (✔마크 + 텍스트)</button>
    <div id="notice"></div>
    <button class="reset-btn" onclick="resetAll()">↺ 전체 초기화</button>
    <div class="hint">
      <b>✔ 마크</b>: 버튼 누르면 생성, 드래그로 이동<br>
      <b>텍스트 칸</b>: 파란 점선 박스 드래그로 이동<br>
      <b>좌표 복사</b>: 모두 복사 → 저에게 붙여넣기
    </div>
  </div>

</div>

<div class="main">

  <!-- 인터넷 신청서 -->
  <div class="form-section">
    <div class="form-ttl">📋 유선상품 가입신청서 (SK 인터넷)</div>

<script>
/* 확정 좌표 (사용자가 드래그로 교정) */
var POS = {
  inet: {
    direct:{x:24.9,y:36.1}, glight:{x:31.8,y:36.1}, giga:{x:42.5,y:36.1},
    gmulti:{x:53.0,y:36.1}, gwifi:{x:63.0,y:36.1},  glwifi:{x:73.0,y:36.1},
    giwifi:{x:24.0,y:37.2}, p25:{x:36.0,y:37.2},    p5:{x:48.0,y:37.2},   p10:{x:58.0,y:37.2}
  },
  wifi:  {g7:{x:24.7,y:38.7}, g:{x:32.3,y:38.5}},
  term:  {'4y':{x:75.3,y:40.3},'3y':{x:78.9,y:40.3},'2y':{x:82.6,y:40.2},'1y':{x:86.3,y:40.4},free:{x:89.7,y:40.2}},
  btv:   {allp:{x:29.6,y:25.9},stdp:{x:39.0,y:25.9},nflxp:{x:49.8,y:25.9},nflxs:{x:65.6,y:25.9}},
  bterm: {'3y':{x:12,y:26.8},etc:{x:17,y:26.8}}
};
var GWRAP = {inet:'iw',wifi:'iw',term:'iw',btv:'bw',bterm:'bw'};
var marks = {};

function sel(btn) {
  var g=btn.dataset.g, k=btn.dataset.k, uid=g+':'+k;
  if (btn.classList.contains('on')) {
    btn.classList.remove('on');
    if (marks[uid]) { marks[uid].remove(); delete marks[uid]; }
    return;
  }
  var pos=POS[g]&&POS[g][k]; if(!pos) return;
  btn.classList.add('on');
  var wrap=document.getElementById(GWRAP[g]);
  var m=document.createElement('div');
  m.className='dm'; m.textContent='✔';
  m.dataset.lbl=btn.textContent.trim();
  m.style.left=pos.x+'%'; m.style.top=pos.y+'%';
  wrap.appendChild(m); marks[uid]=m;
  makeDrag(m);
}

var dinfo=document.getElementById('dinfo');
function makeDrag(el) {
  el.addEventListener('mousedown',function(e){
    e.preventDefault(); e.stopPropagation();
    var wrap=el.parentElement;
    var iL=parseFloat(el.style.left)||0, iT=parseFloat(el.style.top)||0;
    var iX=e.clientX, iY=e.clientY;
    var wW=wrap.offsetWidth, wH=wrap.offsetHeight;
    document.body.style.userSelect='none';
    dinfo.style.display='block';
    function mv(e){
      var dx=(e.clientX-iX)/wW*100, dy=(e.clientY-iY)/wH*100;
      var nx=Math.max(0,Math.min(100,iL+dx)).toFixed(1);
      var ny=Math.max(0,Math.min(100,iT+dy)).toFixed(1);
      el.style.left=nx+'%'; el.style.top=ny+'%';
      dinfo.textContent=(el.dataset.lbl||el.dataset.fid||el.id)+'  x:'+nx+'%  y:'+ny+'%';
    }
    function up(){ document.body.style.userSelect='';
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
}
document.querySelectorAll('.ft').forEach(function(ft){ makeDrag(ft); });

/* 패널 → 서식지 동기화 (자동이체 정보는 TV 서식에도 동기화) */
var FM = {
  'p-name':    ['f-name','btv-name'],
  'p-birth':   ['f-birth','btv-bizno'],
  'p-tel':     ['f-tel'],
  'p-mobile':  ['f-mobile','btv-mobile'],
  'p-addr':    ['f-addr','btv-addr'],
  'p-yegeum':  ['f-yegeum','btv-yegeum'],
  'p-bank':    ['f-bank','btv-bank'],
  'p-account': ['f-account','btv-account'],
  'p-birth2':  ['f-birth2','btv-birth2'],
  'p-mtel2':   ['f-mtel2'],
  'p-legal':   ['f-legal'],
  'p-rel':     ['f-rel'],
  'p-birth3':  ['f-birth3'],
  'p-mtel3':   ['f-mtel3']
};
function sync(inp){
  (FM[inp.id]||[]).forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.textContent=inp.value;
  });
}

/* 전체 좌표 복사 */
function copyAll(){
  var lines=[];
  var mKeys=Object.keys(marks);
  if(mKeys.length){
    lines.push('=== ✔ 요금제 마크 좌표 ===');
    mKeys.forEach(function(uid){
      var m=marks[uid];
      lines.push(m.dataset.lbl+': x:'+parseFloat(m.style.left).toFixed(1)+'% y:'+parseFloat(m.style.top).toFixed(1)+'%');
    });
  }
  lines.push('\n=== 텍스트 위치 ===');
  document.querySelectorAll('.ft').forEach(function(ft){
    lines.push((ft.dataset.fid||ft.id)+': x:'+parseFloat(ft.style.left).toFixed(1)+'% y:'+parseFloat(ft.style.top).toFixed(1)+'%');
  });
  var txt=lines.join('\n');
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){ showN('✅ 복사 완료!\n붙여넣기해서 보내주세요'); });
  } else { prompt('복사하세요:',txt); }
}
function showN(msg){ var n=document.getElementById('notice'); n.textContent=msg; n.style.opacity='1'; setTimeout(function(){ n.style.opacity='0'; },3000); }

function resetAll(){
  document.querySelectorAll('.plan-btn').forEach(function(b){ b.classList.remove('on'); });
  Object.keys(marks).forEach(function(u){ marks[u].remove(); }); marks={};
  document.querySelectorAll('.sb-field input').forEach(function(i){ i.value=''; });
  document.querySelectorAll('.ft').forEach(function(s){ s.textContent=''; });
  dinfo.style.display='none';
}
</script>

<script>
/* ===== 사용자/관리자 모드 구분 ===== */
(function(){
  var isAdmin = new URLSearchParams(location.search).has('edit');
  if(isAdmin) return;

  // 관리자 전용 버튼 숨기기
  ['check-btn'].forEach(function(id){
    var el = document.getElementById(id); if(el) el.style.display='none';
  });
  var header = document.querySelector('header') || document.querySelector('.toolbar');
  if(!header) return;

  header.querySelectorAll('button, label').forEach(function(el){
    var t = el.textContent;
    if(t.indexOf('좌표') !== -1 || t.indexOf('이미지 교체') !== -1) el.style.display='none';
  });

  // T 텍스트 → ✏️ 자유입력 으로 변경하고 활성화 텍스트도 유지
  var tb = document.getElementById('text-btn');
  if(tb){
    tb.textContent = '✏️ 자유입력';
    // offAll() 이 텍스트를 'T 텍스트'로 되돌리는 것을 막기 위해 MutationObserver 사용
    var obs = new MutationObserver(function(){
      if(tb.textContent === 'T 텍스트') tb.textContent = '✏️ 자유입력';
      if(tb.textContent === 'T 끄기')   tb.textContent = '✏️ 끄기';
    });
    obs.observe(tb, {characterData:true, childList:true, subtree:true});
  }

  // 버튼 오른쪽 정렬: 남은 버튼들을 flex-end 그룹으로 묶기
  var btnGroup = document.createElement('div');
  btnGroup.style.cssText = 'display:flex;gap:8px;align-items:center;margin-left:auto;';
  var toMove = [];
  header.querySelectorAll('button, label').forEach(function(el){
    if(el.style.display !== 'none') toMove.push(el);
  });
  toMove.forEach(function(el){ btnGroup.appendChild(el); });
  header.appendChild(btnGroup);
})();
</script>
