<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단말기/USIM 변경 신청서 작성</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic","맑은 고딕",sans-serif; background:#ececec; margin:0; padding:0 0 60px; }

  /* 헤더 */
  header {
    background:#e6002d; color:#fff; padding:10px 16px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    position:sticky; top:0; z-index:50;
  }
  header a.back { color:#ffcdd8; text-decoration:none; font-size:13px; font-weight:600; white-space:nowrap; }
  header h1 { margin:0; font-size:14px; font-weight:800; flex:1; text-align:center; }
  .hdr-btn { padding:7px 13px; font-size:12px; font-weight:700; border:none; border-radius:7px; background:#fff; color:#e6002d; cursor:pointer; white-space:nowrap; }
  .hdr-btn.active-text { background:#ffd600; color:#333; }
  .hdr-btn-print { background:#16283f; color:#fff; padding:7px 13px; font-size:12px; font-weight:700; border:none; border-radius:7px; cursor:pointer; white-space:nowrap; }

  /* 메인 레이아웃 */
  .main-wrap { max-width:1100px; margin:20px auto; display:flex; gap:20px; align-items:flex-start; padding:0 16px; }

  /* 입력 패널 */
  .panel-form {
    flex:0 0 210px; background:#fff; border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.13); padding:16px 14px 20px;
    position:sticky; top:70px;
  }
  .panel-title { font-size:14px; font-weight:800; color:#e6002d; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #e6002d; }
  .pf-row { display:flex; flex-direction:column; gap:3px; margin-bottom:8px; }
  .pf-label { font-size:11px; font-weight:700; color:#64748b; }
  .pf-input {
    border:1.5px solid #e2e8f0; border-radius:6px;
    padding:6px 9px; font-size:13px; font-family:inherit; color:#16283f; outline:none;
    transition:border-color 0.15s;
  }
  .pf-input:focus { border-color:#e6002d; background:#fff7f7; }
  .pf-divider { height:1px; background:#f1f5f9; margin:10px 0; }
  .pf-section-label { font-size:11px; font-weight:700; color:#64748b; margin-bottom:6px; }
  .pf-check-btns { display:flex; gap:6px; }
  .pf-check-btn {
    flex:1; padding:8px 4px; font-size:13px; font-weight:700;
    border:2px solid #e2e8f0; border-radius:7px;
    background:#f8fafc; color:#475569; cursor:pointer; transition:all 0.15s;
  }
  .pf-check-btn:hover { border-color:#e6002d; color:#e6002d; }
  .pf-check-btn.active { background:#e6002d; border-color:#e6002d; color:#fff; }
  .pf-clear {
    width:100%; padding:7px; font-size:12px; font-weight:700;
    border:1.5px solid #e2e8f0; border-radius:6px; background:#f8fafc;
    color:#64748b; cursor:pointer; margin-top:10px;
  }
  .pf-clear:hover { background:#fee2e2; border-color:#e6002d; color:#e6002d; }

  /* 문서 영역 */
  .doc-wrap { flex:1; position:relative; background:#fff; box-shadow:0 4px 20px rgba(0,0,0,0.15); min-width:0; }
  .doc-wrap img { display:block; width:100%; height:auto; user-select:none; }

  /* 오버레이 입력 필드 (패널→문서 반영) */
  .field {
    position:absolute; transform:translateY(-50%);
    border:1px solid rgba(230,0,45,0.4); background:rgba(255,236,179,0.55);
    border-radius:3px; font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    color:#1a1a8c; font-weight:700; padding:0 4px; outline:none; font-size:12px;
    pointer-events:none;
  }

  /* T텍스트 드래그 박스 */
  .textbox {
    position:absolute; border:1px dashed rgba(0,120,255,0.7); background:rgba(255,255,200,0.55);
    outline:none; font-family:"Malgun Gothic","맑은 고딕",sans-serif;
    font-size:13px; font-weight:700; color:#111; padding:0 3px;
    overflow:visible; white-space:nowrap; line-height:1.3; cursor:text;
  }
  .textbox:focus { background:rgba(255,255,200,0.9); border-color:#0078ff; }
  .sel-rect { position:absolute; border:2px dashed #0078ff; background:rgba(0,120,255,0.08); pointer-events:none; }

  /* 체크마크 */
  .check-mark {
    position:absolute; font-size:18px; font-weight:900; color:#e6002d;
    line-height:1; transform:translate(-50%,-50%); display:none; pointer-events:none;
  }
  .check-mark.visible { display:block; }

  /* 인쇄 */
  @media print {
    header { display:none; }
    body { background:#fff; padding:0; }
    .main-wrap { display:block; padding:0; margin:0; max-width:100%; }
    .panel-form { display:none; }
    .doc-wrap { box-shadow:none; margin:0 auto; max-width:100%; }
    .field { border:none; background:transparent; color:#000; }
    .textbox { border:none; background:transparent; }
    .check-mark.visible { display:block; }
  }

  /* 인쇄 푸터 */
  #print-footer { max-width:100%; margin:0 auto; padding:7px 16px; background:#f1f5f9; border-top:1px solid #e2e7ec; font-family:"Malgun Gothic","맑은 고딕",sans-serif; font-size:12px; color:#334155; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  #print-footer span { white-space:nowrap; }
  #print-footer .pfl { font-weight:700; color:#16283f; }
  @media print { #print-footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #bbb; padding:4px 16px; font-size:11px; margin:0; } }
</style>
</head>
<body>
<header>
  <a class="back" href="hub.html">← 허브로 돌아가기</a>
  <h1>단말기 / USIM 변경 신청서 작성</h1>
  <button class="hdr-btn" id="text-btn">T 텍스트</button>
  <button class="hdr-btn" id="undo-btn">↩ 되돌리기</button>
  <button class="hdr-btn" id="pos-즉납-btn" onclick="startCheckPos('즉납')">📍 즉납 위치</button>
  <button class="hdr-btn" id="pos-분납-btn" onclick="startCheckPos('분납')">📍 분납 위치</button>
  <button class="hdr-btn" onclick="exportCoords()">📋 좌표 내보내기</button>
  <label class="hdr-btn" style="cursor:pointer;">🔄 이미지 교체<input type="file" accept="image/*" style="display:none;" onchange="replaceImg(this)"></label>
  <button class="hdr-btn-print" onclick="window.print()">인쇄 / PDF저장</button>
</header>

<div class="main-wrap">
  <!-- 입력 패널 -->
  <div class="panel-form" id="panel-form">
    <div class="panel-title">📝 내용 입력</div>
    <div class="pf-row">
      <label class="pf-label" for="p-f-name">고객명</label>
      <input class="pf-input" id="p-f-name" type="text" placeholder="이름" autocomplete="off" oninput="syncField('f-name',this.value)">
    </div>
    <div class="pf-row">
      <label class="pf-label" for="p-f-phone">이동전화번호</label>
      <input class="pf-input" id="p-f-phone" type="text" placeholder="010-0000-0000" autocomplete="off" oninput="syncField('f-phone',this.value)">
    </div>
    <div class="pf-row">
      <label class="pf-label" for="p-f-birth">법정생년월일</label>
      <input class="pf-input" id="p-f-birth" type="text" placeholder="예: 900101" autocomplete="off" oninput="syncField('f-birth',this.value)">
    </div>
    <div class="pf-row">
      <label class="pf-label" for="p-f-usim">USIM 번호</label>
      <input class="pf-input" id="p-f-usim" type="text" placeholder="USIM 일련번호" autocomplete="off" oninput="syncField('f-usim',this.value)">
    </div>
    <div class="pf-divider"></div>
    <div class="pf-section-label">결제 방식</div>
    <div class="pf-check-btns">
      <button class="pf-check-btn" id="btn-즉납" onclick="selectCheck('즉납')">✔ 즉납</button>
      <button class="pf-check-btn" id="btn-분납" onclick="selectCheck('분납')">✔ 분납</button>
    </div>
    <button class="pf-clear" onclick="clearAll()">전체 지우기</button>
  </div>

  <!-- 문서 이미지 -->
  <div class="doc-wrap" id="wrap1">
    <img id="img1" src="단말기_USIM_변경신청서_p1.jpg" alt="단말기/USIM 변경 신청서">

    <!-- 좌표 툴팁 -->
    <div id="coord-tip" style="display:none;position:absolute;background:rgba(0,0,0,0.78);color:#fff;font-size:11px;font-family:monospace;padding:3px 8px;border-radius:5px;pointer-events:none;z-index:999;white-space:nowrap;"></div>

    <!-- 텍스트 오버레이 필드 -->
    <input class="field" id="f-phone" style="left:22.03%; top:37.85%; width:22.32%; height:2.03%;" placeholder="" readonly tabindex="-1">
    <input class="field" id="f-birth" style="left:65.23%; top:37.97%; width:28.88%; height:2.28%;" placeholder="" readonly tabindex="-1">
    <input class="field" id="f-name"  style="left:22.15%; top:40.59%; width:32.94%; height:2.11%;" placeholder="" readonly tabindex="-1">
    <input class="field" id="f-usim"  style="left:18.69%; top:47.00%; width:26.25%; height:2.11%;" placeholder="" readonly tabindex="-1">

    <!-- 즉납/분납 체크마크 -->
    <div class="check-mark" id="check-즉납" style="left:45.8%; top:46.9%;">✔</div>
    <div class="check-mark" id="check-분납" style="left:50.2%; top:47.0%;">✔</div>
  </div>
</div>

<div id="print-footer">
  <span><span class="pfl">접수처:</span> 현성네트워크</span>
  <span><span class="pfl">연락처:</span> 📞 043)216-0550 · 010-5835-7010</span>
  <span><span class="pfl">날짜:</span> <span id="pf-date"></span></span>
  <span><span class="pfl">시간:</span> <span id="pf-time"></span></span>
</div>

<script>
/* ===== 패널 → 문서 연동 ===== */
function syncField(id, val) {
  var el = document.getElementById(id);
  if (el) el.value = val;
}

function selectCheck(type) {
  ['즉납','분납'].forEach(function(t) {
    var btn = document.getElementById('btn-'+t);
    var chk = document.getElementById('check-'+t);
    if (t === type) {
      var on = btn.classList.contains('active');
      btn.classList.toggle('active');
      if (chk) { on ? chk.classList.remove('visible') : chk.classList.add('visible'); }
    } else {
      btn.classList.remove('active');
      if (chk) chk.classList.remove('visible');
    }
  });
}

function clearAll() {
  ['f-name','f-phone','f-birth','f-usim'].forEach(function(id) {
    var el  = document.getElementById(id);      if (el)  el.value = '';
    var pel = document.getElementById('p-'+id); if (pel) pel.value = '';
  });
  ['즉납','분납'].forEach(function(t) {
    document.getElementById('btn-'+t).classList.remove('active');
    var chk = document.getElementById('check-'+t); if (chk) chk.classList.remove('visible');
  });
}

function replaceImg(input) {
  var file = input.files[0]; if (!file) return;
  if (file.size > 8*1024*1024) { alert('8MB 초과'); return; }
  var r = new FileReader();
  r.onload = function(ev) { document.getElementById('img1').src = ev.target.result; };
  r.readAsDataURL(file); input.value = '';
}

/* ===== 좌표 내보내기 ===== */
function exportCoords() {
  var wrap = document.getElementById('wrap1');
  var boxes = wrap.querySelectorAll('.textbox');
  if (!boxes.length) { alert('T 텍스트 모드로 칸을 먼저 드래그해 주세요.'); return; }
  var lines = [];
  boxes.forEach(function(b, i) {
    var l = parseFloat(b.style.left).toFixed(2);
    var t = parseFloat(b.style.top).toFixed(2);
    var w = parseFloat(b.style.width).toFixed(2);
    var h = parseFloat(b.style.minHeight).toFixed(2);
    lines.push('필드 '+(i+1)+': left:'+l+'%, top:'+t+'%, width:'+w+'%, height:'+h+'%');
  });
  // 체크마크 위치도 추가
  ['즉납','분납'].forEach(function(t) {
    var chk = document.getElementById('check-' + t);
    if (chk && chk.dataset.left) {
      lines.push('✔ ' + t + ': left:' + chk.dataset.left + '%, top:' + chk.dataset.top + '%');
    }
  });
  var result = '📋 텍스트박스 좌표\n' + lines.join('\n');
  var ta = document.createElement('textarea');
  ta.value = result;
  ta.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);width:600px;max-width:95vw;height:200px;z-index:9999;font-family:monospace;font-size:13px;padding:10px;border:2px solid #e6002d;border-radius:8px;resize:vertical;';
  document.body.appendChild(ta);
  ta.select(); document.execCommand('copy');
  ta.addEventListener('blur', function() { ta.remove(); });
  ta.addEventListener('keydown', function(e) { if (e.key === 'Escape') ta.remove(); });
  alert('좌표가 클립보드에 복사됐습니다!\nClaude에게 붙여넣기 하세요.\n(ESC 또는 클릭 밖으로 나가면 닫힙니다)');
}

/* ===== 체크 위치 설정 ===== */
var checkPosMode = null;

function startCheckPos(type) {
  checkPosMode = type;
  var wrap = document.getElementById('wrap1');
  wrap.style.cursor = 'crosshair';
  // 버튼 강조
  ['즉납','분납'].forEach(function(t) {
    var btn = document.getElementById('pos-'+t+'-btn');
    btn.style.background = (t === type) ? '#ffd600' : '';
    btn.style.color = (t === type) ? '#333' : '';
  });
}

/* ===== 좌표 툴팁 + 체크 클릭 처리 ===== */
(function() {
  var wrap = document.getElementById('wrap1');
  var tip  = document.getElementById('coord-tip');

  wrap.addEventListener('mousemove', function(e) {
    if (e.target.closest('.textbox') || e.target.closest('.pf-check-btn')) return;
    var img = wrap.querySelector('img');
    var r   = wrap.getBoundingClientRect();
    var x   = ((e.clientX - r.left) / wrap.offsetWidth  * 100).toFixed(1);
    var y   = ((e.clientY - r.top)  / img.offsetHeight  * 100).toFixed(1);
    tip.textContent = 'left:' + x + '%  top:' + y + '%';
    tip.style.display = 'block';
    tip.style.left = (e.clientX - r.left + 14) + 'px';
    tip.style.top  = (e.clientY - r.top  + 14) + 'px';
  });
  wrap.addEventListener('mouseleave', function() { tip.style.display = 'none'; });

  wrap.addEventListener('click', function(e) {
    if (!checkPosMode) return;
    if (e.target.closest('.textbox') || e.target.closest('.field')) return;
    var img = wrap.querySelector('img');
    var r   = wrap.getBoundingClientRect();
    var x   = ((e.clientX - r.left) / wrap.offsetWidth  * 100).toFixed(1);
    var y   = ((e.clientY - r.top)  / img.offsetHeight  * 100).toFixed(1);

    var chk = document.getElementById('check-' + checkPosMode);
    chk.style.left    = x + '%';
    chk.style.top     = y + '%';
    chk.style.display = 'block';   // 위치 확인용 표시
    chk.dataset.left  = x;
    chk.dataset.top   = y;

    // 알림
    alert('✔ ' + checkPosMode + ' 위치 설정됨\nleft:' + x + '%  top:' + y + '%\n\n좌표 내보내기 후 Claude에게 붙여넣기 하세요.');

    // 모드 해제
    checkPosMode = null;
    wrap.style.cursor = '';
    ['즉납','분납'].forEach(function(t) {
      var btn = document.getElementById('pos-'+t+'-btn');
      btn.style.background = ''; btn.style.color = '';
    });
  });
})();

/* ===== T텍스트 드래그 ===== */
(function() {
  var textBtn = document.getElementById('text-btn');
  var undoBtn = document.getElementById('undo-btn');
  var textOn = false;
  var undoStack = [];
  var dragStart = null, selRect = null;

  function offAll() {
    textOn = false;
    textBtn.classList.remove('active-text');
    textBtn.textContent = 'T 텍스트';
    document.querySelectorAll('.doc-wrap, #wrap1').forEach(function(w) {
      w.style.cursor = ''; w.style.userSelect = '';
    });
  }

  textBtn.addEventListener('click', function() {
    if (textOn) { offAll(); return; }
    offAll(); textOn = true;
    textBtn.classList.add('active-text');
    textBtn.textContent = 'T 끄기';
    document.getElementById('wrap1').style.cursor = 'crosshair';
    document.getElementById('wrap1').style.userSelect = 'none';
  });

  var wrap = document.getElementById('wrap1');

  wrap.addEventListener('mousedown', function(e) {
    if (!textOn || e.target.closest('.textbox') || e.target.closest('.field')) return;
    e.preventDefault();
    var r = wrap.getBoundingClientRect();
    dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
    selRect = document.createElement('div');
    selRect.className = 'sel-rect';
    selRect.style.left = dragStart.x + 'px';
    selRect.style.top  = dragStart.y + 'px';
    wrap.appendChild(selRect);
  });

  window.addEventListener('mousemove', function(e) {
    if (!textOn || !dragStart) return;
    var r = wrap.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    var x = Math.min(dragStart.x, cx), y = Math.min(dragStart.y, cy);
    selRect.style.left   = x + 'px'; selRect.style.top    = y + 'px';
    selRect.style.width  = Math.abs(cx - dragStart.x) + 'px';
    selRect.style.height = Math.abs(cy - dragStart.y) + 'px';
  });

  window.addEventListener('mouseup', function(e) {
    if (!textOn || !dragStart) return;
    var img = wrap.querySelector('img');
    var r = wrap.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    var x = Math.min(dragStart.x, cx), y = Math.min(dragStart.y, cy);
    var ww = Math.abs(cx - dragStart.x), hh = Math.abs(cy - dragStart.y);
    selRect.remove(); selRect = null; dragStart = null;
    if (ww < 10 || hh < 4) return;
    var iw = wrap.offsetWidth, ih = img.offsetHeight;
    var box = document.createElement('div');
    box.className = 'textbox'; box.contentEditable = 'true';
    box.style.left      = (x / iw * 100) + '%';
    box.style.top       = (y / ih * 100) + '%';
    box.style.width     = (ww / iw * 100) + '%';
    box.style.minHeight = (hh / ih * 100) + '%';
    box.addEventListener('keydown', function(ev) {
      if ((ev.key === 'Delete' || ev.key === 'Backspace') && box.textContent === '') {
        ev.preventDefault(); box.remove();
      }
    });
    wrap.appendChild(box); box.focus();
    undoStack.push(box);
  });

  function undo() { var last = undoStack.pop(); if (last) last.remove(); }
  undoBtn.addEventListener('click', undo);
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'z') {
      var a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.contentEditable === 'true')) return;
      e.preventDefault(); undo();
    }
  });
})();

/* ===== 사용자/관리자 모드 ===== */
(function() {
  var isAdmin = new URLSearchParams(location.search).has('edit');
  if (isAdmin) return;

  var header = document.querySelector('header');
  if (!header) return;
  header.querySelectorAll('button, label').forEach(function(el) {
    var t = el.textContent;
    if (t.indexOf('텍스트') !== -1 || t.indexOf('좌표') !== -1 || t.indexOf('이미지 교체') !== -1 || t.indexOf('되돌리기') !== -1 || t.indexOf('위치') !== -1) {
      el.style.display = 'none';
    }
  });
})();

/* ===== 인쇄 푸터 ===== */
(function() {
  function pfUpdate() {
    var d = new Date();
    document.getElementById('pf-date').textContent = d.getFullYear() + '.' + (''+(d.getMonth()+1)).padStart(2,'0') + '.' + (''+d.getDate()).padStart(2,'0');
    document.getElementById('pf-time').textContent = (''+d.getHours()).padStart(2,'0') + ':' + (''+d.getMinutes()).padStart(2,'0');
  }
  pfUpdate(); setInterval(pfUpdate, 30000);
  window.addEventListener('beforeprint', pfUpdate);
})();
</script>
</body>
</html>
